# ------------------------------------------------------------------ FPU32 (SPRUEO2B / SPRUHS1C chapter 1)
# Opcodes are LSW (first word) then MSW.  `conf: ref` = checked against SPRUHS1C (SPRUEO2B where they agree).
# MOV32 RaH,{ACC|P|XT|XARn} / MOV32 {ACC|P|XT|XARn},RaH (SPRUHS1C: "LSW 1011 1101 loc32 / MSW IIII..." and
# "1011 1111 loc32 / IIII...") are the MOV32 *(0:16bit),loc32 / MOV32 loc32,*(0:16bit) opcodes whose 16-bit word is
# the FPU register's internal address 0x0F12 + 4*a (R0H = 0x0F12 ... R7H = 0x0F2E).  Confirmed by cl2000 25.11.1
# output (RTS fpu32 library: 0xBFAB 0x0F12 = MOV32 @P,R0H, 0xBDA9 0x0F16 = MOV32 R1H,@ACC) and dis2000.  a+4 in bits
# 6:2 is not a plain field, so there is one entry per register; they precede the mem32 forms so the assembler emits
# TI's encoding for register operands (memory operands still use 0xE2AF/0xE203).  ACC destination: ST0 N/Z.
- {mn: MOV32,   ops: "R0H, reg32", enc: "1011 1101 LLLL LLLL 0000 1111 0001 0010", sem: f_mvloc, a: {ra: 0, to: f}, conf: ref}
- {mn: MOV32,   ops: "R1H, reg32", enc: "1011 1101 LLLL LLLL 0000 1111 0001 0110", sem: f_mvloc, a: {ra: 1, to: f}, conf: ref}
- {mn: MOV32,   ops: "R2H, reg32", enc: "1011 1101 LLLL LLLL 0000 1111 0001 1010", sem: f_mvloc, a: {ra: 2, to: f}, conf: ref}
- {mn: MOV32,   ops: "R3H, reg32", enc: "1011 1101 LLLL LLLL 0000 1111 0001 1110", sem: f_mvloc, a: {ra: 3, to: f}, conf: ref}
- {mn: MOV32,   ops: "R4H, reg32", enc: "1011 1101 LLLL LLLL 0000 1111 0010 0010", sem: f_mvloc, a: {ra: 4, to: f}, conf: ref}
- {mn: MOV32,   ops: "R5H, reg32", enc: "1011 1101 LLLL LLLL 0000 1111 0010 0110", sem: f_mvloc, a: {ra: 5, to: f}, conf: ref}
- {mn: MOV32,   ops: "R6H, reg32", enc: "1011 1101 LLLL LLLL 0000 1111 0010 1010", sem: f_mvloc, a: {ra: 6, to: f}, conf: ref}
