# TMS320C28x (+FPU32) instruction table: the single source of truth for the decoder (chipem/core/c28x/isa.py),
# the interpreter semantics (chipem/core/c28x/sem.py, fpu.py), the assembler and the disassembler (asm.py).
#
# Checked against TI's reference guides (see docs/C28X_CORE.md, "Reference and verification"):
#   base ISA  SPRU430F (TMS320C28x CPU and Instruction Set, rev. F, April 2015), chapter 6 opcode fields
#   FPU32     SPRUHS1C (C28x Extended Instruction Sets, chapter 1 FPU) and SPRUEO2B
# `conf`: ref = opcode checked against those documents; low = not (fully) given by them (see the comment on the
# entry).  The previous memory-based levels (high/med) are gone.
#
# Entry keys
#   mn    mnemonic
#   ops   operand pattern, comma separated.  Each operand is a *kind* (below) or literal text (`ACC`, `XAR4`,
#         `*XAR7++`, `ACC:P`, `#16` ...).  `X<<Y` splits an operand into a value and a shift part.
#   enc   16 or 32 bit characters (spaces ignored), MSB first, first word then second word.  `0`/`1` are fixed
#         bits; a letter is a field bit.  A field's value is the concatenation of its bits in string order.
#   sem   semantics key (a factory in sem.py / fpu.py); `a` = fixed arguments for it.
#   conf  ref | low.   `norpt: true` = not repeatable under RPT (flow control).
#   alias true = assembler-only spelling of another entry's encoding (ZAP OVC = CLRC OVC ...); never decoded.
#   par   parallel instruction `A||B`: the first `par` operands belong to A ("MPYF32 a,b,c || ADDF32 d,e,f").
#
# Field letters (operand kind -> letter):
#   L loc16/loc32 addressing byte        A AX (0=AL 1=AH)        n ARn/XARn       m ARm
#   C immediate (#u*, #s*, #f16, pma, pa, abs16)                 B #bit           H shift (#sh*)
#   K COND / CNDF       O branch offset (off8/off16, relative to the branch's own address)
#   X addr22            P pm (SPM)          M mode (SETC/CLRC)   I intx (INTR)
#   S RPTB block size (rblock: end label, RSIZE = end - (pc + 2))
#   a b c d e f  FPU register numbers (RaH..RfH)                  F/V FPU flag mask / values
#   x  don't-care bits (SPRU430F "xxxx"): ignored by the decoder, assembled as 0
# Shift fields: #1..16 / #1..8 shifts are stored as shift-1 (SPRU430F gives only "SHFT"; the C27x-mode forms of
# MOV/MOVH loc16,ACC<<1..8 put 8 values in 3 bits, which fixes the bias at 1).
version: 1
instructions:
