- {mn: SETC,    ops: "AMODE",       enc: "0101 0110 0001 1110", sem: st1bit, a: {f: amode, v: 1}, conf: ref, alias: true}
- {mn: SPM,     ops: "pm",          enc: "1111 1111 0110 1PPP", sem: spm, conf: ref}
- {mn: ASP,     ops: "",            enc: "0111 0110 0001 1011", sem: asp, conf: ref}
