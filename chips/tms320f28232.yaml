# TI TMS320F28232 (C2823x: fixed-point C28x, no FPU, 100 MHz), 176-pin LQFP "PGF".
# Sources: SPRS439Q (Aug 2022) data sheet: Table 5-2 (F28232: 64K flash, 26K SARAM = M0/M1 + L0-L5, 2 SCIs, 1 McBSP,
# eCAP1-4), Table 6-1 (PGF pin numbers), Tables 8-18..8-20 (GPIO mux), Figure 8-25 and Tables 8-24, 8-27..8-35
# (memory map, flash sectors, peripheral frames), Table 8-32 (PIE interrupts).  Register details: chips/
# tms320f28232_regs.yaml (hand-written, see its header).  Address units are 16-bit words (addr_unit_bits: 16):
# every base/size below counts words.  The pin table was generated from the data sheet text and cross-checked
# (176 unique pin numbers; every MUX1-3 function appears in that GPIO's Table 6-1 block).
name: TMS320F28232
package: LQFP176 (PGF)
family: ti_c2000
regs_file: tms320f28232_regs.yaml
gpio_name_format: "GPIO{num}"          # port A/B/C = GPIO0-31/32-63/64-87, `bit` within the port
core: {arch: c28x, backend: c28x, cpu: c28x, fpu: false, clock_hz: 100000000, addr_unit_bits: 16, num_irqs: 0}

boot:
  entry: 0x33FFF6                      # boot-to-flash entry (program a LB _c_int00 here); an image entry overrides
  sp: 0x0400
  rom_words:                           # seeded into erased ROM at reset (we have no boot ROM / TI OTP contents)
    0x380080: [0x0006]                 # ADC_cal routine (Device_cal): just LRETR
    0x380090: [0x00E6]                 # PARTID: TMS320F28232
auto_stub_ranges: [[0x0800, 0x0FFF], [0x5000, 0x7FFF]]   # unmodelled PF0/PF1-3 registers become RAM-like stubs

memory:
  - {name: M0, base: 0x000000, size: 0x0400, kind: ram}        # M0 SARAM (first 0x40 words: M0 vectors, VMAP=0)
  - {name: M1, base: 0x000400, size: 0x0400, kind: ram}        # M1 SARAM; SP = 0x0400 after reset
  - {name: XINTF0, base: 0x004000, size: 0x1000, kind: ram}    # XINTF zone 0 (external; RAM stub)
  - {name: L0L5, base: 0x008000, size: 0x6000, kind: ram}      # L0-L3 (secure, dual-mapped) + L4-L5 SARAM
  - {name: XINTF6, base: 0x100000, size: 0x100000, kind: ram}  # XINTF zone 6 (1M x 16; RAM stub)
  - {name: XINTF7, base: 0x200000, size: 0x100000, kind: ram}  # XINTF zone 7 (1M x 16; RAM stub)
  - {name: FLASH, base: 0x330000, size: 0x10000, kind: flash, fill: 0xFF}  # sectors D,C,B,A (16K each); 0x33FFF6 entry,
                                                                           # 0x33FFF8-0x33FFFF CSM password
  - {name: OTP, base: 0x380000, size: 0x0800, kind: rom, fill: 0xFF}       # ADC cal + PARTID (0x380080-0x380090),
                                                                           # user OTP 0x380400-0x3807FF
  - {name: BOOTROM, base: 0x3FE000, size: 0x2000, kind: rom, fill: 0xFF}   # boot ROM (8K); BROM vectors at 0x3FFFC0

peripherals:
  # L0-L3 are dual-mapped at 0x3F8000 (the TI linker's usual "RAML0" at 0x8000 / program view at 0x3F8000)
  - {name: L03HI, model: ti_c2000.alias, base: 0x3F8000, size: 0x4000, params: {target: 0x8000}}
  # Peripheral Frame 0
  - {name: DEV_EMU, model: ti_c2000.storage, base: 0x0880, size: 0x180}
  - {name: FLASHREGS, model: ti_c2000.flash, base: 0x0A80, size: 0x60, params: {regs: FLASH}}
  - {name: CSM, model: ti_c2000.csm, base: 0x0AE0, size: 0x10}
  - {name: ADCMIRROR, model: ti_c2000.adcmirror, base: 0x0B00, size: 0x10}
  - {name: XINTF, model: ti_c2000.storage, base: 0x0B20, size: 0x20}
  - {name: CPUTIMER0, model: ti_c2000.cputimer, base: 0x0C00, size: 0x8, params: {index: 0}}
  - {name: CPUTIMER1, model: ti_c2000.cputimer, base: 0x0C08, size: 0x8, params: {index: 1}}
  - {name: CPUTIMER2, model: ti_c2000.cputimer, base: 0x0C10, size: 0x8, params: {index: 2}}
  - {name: PIE, model: ti_c2000.pie, base: 0x0CE0, size: 0x120}   # arch-owned (chipem/arch/c28x), incl. vectors
  - {name: DMA, model: ti_c2000.storage, base: 0x1000, size: 0x200, params: {gate: DMAENCLK}}
  # Peripheral Frame 3
  - {name: MCBSPA, model: ti_c2000.storage, base: 0x5000, size: 0x40, params: {gate: MCBSPAENCLK}}
  # Peripheral Frame 1
  - {name: ECANA, model: ti_c2000.storage, base: 0x6000, size: 0x200, params: {gate: ECANAENCLK}}
  - {name: ECANB, model: ti_c2000.storage, base: 0x6200, size: 0x200, params: {gate: ECANBENCLK}}
  - {name: EPWM1, model: ti_c2000.epwm, base: 0x6800, size: 0x40, params: {gate: EPWM1ENCLK, index: 1}}
  - {name: EPWM2, model: ti_c2000.epwm, base: 0x6840, size: 0x40, params: {gate: EPWM2ENCLK, index: 2}}
  - {name: EPWM3, model: ti_c2000.epwm, base: 0x6880, size: 0x40, params: {gate: EPWM3ENCLK, index: 3}}
  - {name: EPWM4, model: ti_c2000.epwm, base: 0x68C0, size: 0x40, params: {gate: EPWM4ENCLK, index: 4}}
  - {name: EPWM5, model: ti_c2000.epwm, base: 0x6900, size: 0x40, params: {gate: EPWM5ENCLK, index: 5}}
  - {name: EPWM6, model: ti_c2000.epwm, base: 0x6940, size: 0x40, params: {gate: EPWM6ENCLK, index: 6}}
  - {name: ECAP1, model: ti_c2000.storage, base: 0x6A00, size: 0x20, params: {gate: ECAP1ENCLK}}
  - {name: ECAP2, model: ti_c2000.storage, base: 0x6A20, size: 0x20, params: {gate: ECAP2ENCLK}}
  - {name: ECAP3, model: ti_c2000.storage, base: 0x6A40, size: 0x20, params: {gate: ECAP3ENCLK}}
  - {name: ECAP4, model: ti_c2000.storage, base: 0x6A60, size: 0x20, params: {gate: ECAP4ENCLK}}
  - {name: EQEP1, model: ti_c2000.storage, base: 0x6B00, size: 0x40, params: {gate: EQEP1ENCLK}}
  - {name: EQEP2, model: ti_c2000.storage, base: 0x6B40, size: 0x40, params: {gate: EQEP2ENCLK}}
  - {name: GPIO, model: ti_c2000.gpio, base: 0x6F80, size: 0x80}
  # Peripheral Frame 2
  - {name: SYSCTRL, model: ti_c2000.sysctrl, base: 0x7010, size: 0x20,
     params: {ext_hz: 20000000, boot_divsel: 2}}   # 20 MHz crystal: PLLCR=10, DIVSEL=/2 -> 100 MHz (TI 100 MHz setup)
  - {name: SPIA, model: ti_c2000.spi, base: 0x7040, size: 0x10}
  - {name: SCIA, model: ti_c2000.sci, base: 0x7050, size: 0x10}
  - {name: XINT, model: ti_c2000.xint, base: 0x7070, size: 0x10}
  - {name: ADC, model: ti_c2000.adc, base: 0x7100, size: 0x20}
  - {name: SCIB, model: ti_c2000.sci, base: 0x7750, size: 0x10}
  - {name: I2CA, model: ti_c2000.storage, base: 0x7900, size: 0x40, params: {gate: I2CAENCLK}}

# Interrupts by vector number (PIE INTx.y = 32 + 8(x-1) + (y-1), table at 0x0D00 + 2n; 13/14 = CPU INT13/INT14).
# Peripheral models name their lines with these; `set_irq` also accepts "x.y".  Not on F28232: SCI-C (8.5/8.6),
# eCAP5/6 (4.5/4.6), McBSP-B (6.3/6.4), FPU LVF/LUF (12.7/12.8).
irqs:
  13: INT13          # CPU timer 1 (or XNMI with XNMICR.SELECT)
  14: INT14          # CPU timer 2
  18: NMI
  19: ILLEGAL
  32: SEQ1INT        # 1.1 ADC
  33: SEQ2INT        # 1.2 ADC
  35: XINT1          # 1.4
  36: XINT2          # 1.5
  37: ADCINT         # 1.6
  38: TINT0          # 1.7 CPU timer 0
  39: WAKEINT        # 1.8 LPM / watchdog
  40: EPWM1_TZINT
  41: EPWM2_TZINT
  42: EPWM3_TZINT
  43: EPWM4_TZINT
  44: EPWM5_TZINT
  45: EPWM6_TZINT
  48: EPWM1_INT
  49: EPWM2_INT
  50: EPWM3_INT
  51: EPWM4_INT
  52: EPWM5_INT
  53: EPWM6_INT
  56: ECAP1_INT
  57: ECAP2_INT
  58: ECAP3_INT
  59: ECAP4_INT
  64: EQEP1_INT
  65: EQEP2_INT
  72: SPIRXINTA      # 6.1
  73: SPITXINTA      # 6.2
  76: MRINTA         # 6.5 McBSP-A
  77: MXINTA         # 6.6
  80: DINTCH1        # 7.x DMA
  81: DINTCH2
  82: DINTCH3
  83: DINTCH4
  84: DINTCH5
  85: DINTCH6
  88: I2CINT1A       # 8.1
  89: I2CINT2A       # 8.2
  96: SCIRXINTA      # 9.1
  97: SCITXINTA      # 9.2
  98: SCIRXINTB      # 9.3
  99: SCITXINTB      # 9.4
  100: ECAN0_INTA
  101: ECAN1_INTA
  102: ECAN0_INTB
  103: ECAN1_INTB
  120: XINT3         # 12.1
  121: XINT4
  122: XINT5
  123: XINT6
  124: XINT7

