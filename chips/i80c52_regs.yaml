# Generic 80C52 SFR table, HAND-WRITTEN from the classic Intel MCS-51 / 80C52 SFR map (Intel "MCS-51 Microcontroller
# Family User's Manual", 8XC52 SFRs): the P89CV51 table (chips/p89cv51_regs.yaml) reduced to the 80C52 set by a
# script: core registers, IE/IP (two priority levels, no IPH), P0-P3, PCON (SMOD SMOD0 - - GF1 GF0 PD IDL),
# TCON/TMOD/TL0/TL1/TH0/TH1, T2CON/T2MOD/RCAP2L/RCAP2H/TL2/TH2, SCON/SBUF/SADDR/SADEN.  NOT from a data sheet:
