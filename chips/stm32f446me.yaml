# STMicroelectronics STM32F446ME (STM32F446xx die, DEV_ID 0x421: same core, memory map, peripherals and IRQs as
# chips/stm32f446re.yaml, which is included below; 512 KB flash, 128 KB SRAM, WLCSP81). Part number: see the base file.
# Ball numbering: `num` = row-major index over the 9 x 9 bumps (rows A..J without I, columns 1..9; A1 = 1, J9 = 81),
# `ball` = the bump name.
include: stm32f446re.yaml
name: STM32F446ME
package: WLCSP81
regs_file: stm32f446_regs.yaml

# Pin table: generated from ST's STM32_open_pin_data @ 7d1f1514ed5583ec5007ad91236b4e1d377295b1 (cached in
# svd/dl-open-pin-data-f446/): mcu/STM32F446M(C-E)Yx.xml gives the WLCSP81 positions and the signals of each pin,
# mcu/IP/GPIO-STM32F446_gpio_v1_0_Modes.xml the AF number of every alternate function. The data sheet (DS10693) is not
# in the repo, so the names follow ST's open pin data with the DS8626/DS9405 spelling conventions of the other STM32F4
# files: USB_OTG_FS_* / USB_OTG_HS_* -> OTG_FS_* / OTG_HS_*, SYS_JTMS-SWDIO -> JTMS-SWDIO (etc.), RCC_MCO_1 -> MCO1,
# SPIx and I2Sx signals on the same AF joined as SPIx_SCK/I2Sx_CK; ADCn_INm -> ADC123_INm; RCC_OSC_IN -> analog OSC_IN;
# SYS_WKUPn -> additional WKUPn (ST numbers the two wake-up pins WKUP0 = PA0 and WKUP1 = PC13); FMC_CLE / FMC_ALE
# (no own AF in the modes file) share AF12 with FMC_A16 / FMC_A17. ST's pseudo-signals ADCx_EXTIy / DAC_EXTIy (EXTI
# lines as converter triggers) are not pin functions and are left out. EVENTOUT (AF15) on every GPIO.
# Second source: the GPIO_AFn_<periph> defines for STM32F446xx in stm32f4xx_hal_gpio_ex.h (every AF/peripheral pair of
# the table exists there; tests/test_stm32f446_pins.py).
# All 81 balls (63 GPIOs, IONb in the open pin data).
