# STMicroelectronics STM32F427VG (Cortex-M4F, 180 MHz with over-drive, 1 MB flash (single bank, dual bank with the
# DB1M option bit), 256 KB RAM = 192 KB SRAM1/2/3 + 64 KB CCM, LQFP100). Base file of the STM32F427xx/STM32F437xx die
# (DEV_ID 0x419): chips/stm32f437ai.yaml includes it and overrides name, package, memory and pins.
# Sources: DS9405 Rev 14 (STM32F427xx/STM32F429xx data sheet): Table 10 (pin and ball definitions, LQFP100 column),
# Table 12 (alternate function mapping AF0..AF15), Table 13 (register boundary addresses), section 8 (ordering
# information: V = 100 pins, G = 1024 KB); RM0090 Rev 22 (Table 63 vector table for STM32F42xxx/43xxx, chapter 6 RCC
# for STM32F42xxx/43xxx, 5.5 PWR registers for STM32F42xxx/43xxx, 3.5/3.9 dual-bank flash);
# CMSIS-SVD STM32F427.svd (cmsis-svd-data @ c65f8551, see chips/README.md) for bases, IRQ numbers and the register
# table chips/stm32f427_regs.yaml.
# LCD-TFT (LTDC, LCD_* alternate functions, IRQ 88/89) exists only on the STM32F429/F439 and is omitted.
# CRYP/HASH are bonded out only on the STM32F437/F439 (`only:` gate, inactive stub on the F427).
name: STM32F427VG
package: LQFP100
family: stm32
regs_file: stm32f427_regs.yaml
gpio_name_format: "P{port}{bit}"
# 16 MHz = HSI after reset; stm32.rcc_f42x derives HCLK from the PLL/prescaler registers and retunes the clock.
# num_irqs 91: highest vector is 90 DMA2D (RM0090 Table 63).
core: {arch: armv7e-m, backend: unicorn, cpu: cortex-m4, fpu: true, clock_hz: 16000000, addr_unit_bits: 8, num_irqs: 91}
# SysTick CLKSOURCE=0 reference: HCLK/8 (RM0090 Figure 16 clock tree, "To Cortex System timer").
systick_ext_div: 8
# Boot from main flash (BOOT0 = 0) through the alias at 0x00000000, which CHIP_EM does not map: VTOR starts at the
# flash base (images are linked at 0x08000000).
vtor: 0x08000000

memory:
  - {name: FLASH, base: 0x08000000, size: 0x100000, kind: flash}   # 1 MB (DB1M = 0: sectors 0-11; DB1M = 1: 0-7 + 12-19)
  - {name: CCMRAM, base: 0x10000000, size: 0x10000, kind: ram}     # 64 KB CCM data RAM (CPU only)
  - {name: SRAM, base: 0x20000000, size: 0x30000, kind: ram}       # SRAM1 112 KB + SRAM2 16 KB + SRAM3 64 KB
  - {name: BKPSRAM, base: 0x40024000, size: 0x1000, kind: ram}     # backup SRAM (AHB1)
  # system memory (0x1FFF0000), OTP (0x1FFF7800) and option bytes (0x1FFFC000 / 0x1FFEC000) are not mapped

# armv7m.scs (0xE000E000, SysTick/NVIC/SCB) is created by the arch layer, not listed here.
peripherals:
  # APB1
  - {name: TIM2, model: stm32.tim, base: 0x40000000, size: 0x400}
  - {name: TIM3, model: stm32.tim, base: 0x40000400, size: 0x400}
  - {name: TIM4, model: stm32.tim, base: 0x40000800, size: 0x400}
  - {name: TIM5, model: stm32.tim, base: 0x40000C00, size: 0x400}
  - {name: TIM6, model: stm32.tim, base: 0x40001000, size: 0x400}
  - {name: TIM7, model: stm32.tim, base: 0x40001400, size: 0x400}
  - {name: TIM12, model: stm32.tim, base: 0x40001800, size: 0x400}
  - {name: TIM13, model: stm32.tim, base: 0x40001C00, size: 0x400}
  - {name: TIM14, model: stm32.tim, base: 0x40002000, size: 0x400}
  - {name: RTC, model: stm32.rtc, base: 0x40002800, size: 0x400}   # RTC and backup registers (backup domain)
  - {name: WWDG, model: stm32.wwdg, base: 0x40002C00, size: 0x400}
  - {name: IWDG, model: stm32.iwdg, base: 0x40003000, size: 0x400}
  - {name: I2S2ext, model: stm32.i2s_ext, base: 0x40003400, size: 0x400, params: {main: SPI2}}   # I2S2 full-duplex extension
  - {name: SPI2, model: stm32.spi, base: 0x40003800, size: 0x400}   # SPI2/I2S2
  - {name: SPI3, model: stm32.spi, base: 0x40003C00, size: 0x400}   # SPI3/I2S3
  - {name: I2S3ext, model: stm32.i2s_ext, base: 0x40004000, size: 0x400, params: {main: SPI3}}   # I2S3 full-duplex extension
  - {name: USART2, model: stm32.usart, base: 0x40004400, size: 0x400, params: {index: 2, kind: usart}}
  - {name: USART3, model: stm32.usart, base: 0x40004800, size: 0x400, params: {index: 3, kind: usart}}
  - {name: UART4, model: stm32.usart, base: 0x40004C00, size: 0x400, params: {index: 4, kind: uart}}
  - {name: UART5, model: stm32.usart, base: 0x40005000, size: 0x400, params: {index: 5, kind: uart}}
  - {name: I2C1, model: stm32.i2c, base: 0x40005400, size: 0x400}   # with FLTR (digital noise filter, RM0090 27.6.10)
  - {name: I2C2, model: stm32.i2c, base: 0x40005800, size: 0x400}
  - {name: I2C3, model: stm32.i2c, base: 0x40005C00, size: 0x400}
  - {name: CAN1, model: stm32.can, base: 0x40006400, size: 0x400}            # bxCAN master: owns the 28 filter banks
  - {name: CAN2, model: stm32.can, base: 0x40006800, size: 0x400}            # bxCAN slave: needs the CAN1 clock
  - {name: PWR, model: stm32.pwr_f42x, base: 0x40007000, size: 0x400}        # over-drive / under-drive (RM0090 5.5)
  - {name: DAC, model: stm32.dac, base: 0x40007400, size: 0x400}
  - {name: UART7, model: stm32.usart, base: 0x40007800, size: 0x400, params: {index: 7, kind: uart}}
  - {name: UART8, model: stm32.usart, base: 0x40007C00, size: 0x400, params: {index: 8, kind: uart}}
  # APB2
  - {name: TIM1, model: stm32.tim, base: 0x40010000, size: 0x400}
  - {name: TIM8, model: stm32.tim, base: 0x40010400, size: 0x400}
  - {name: USART1, model: stm32.usart, base: 0x40011000, size: 0x400, params: {index: 1, kind: usart}}
  - {name: USART6, model: stm32.usart, base: 0x40011400, size: 0x400, params: {index: 6, kind: usart}}
  - {name: ADC1, model: stm32.adc, base: 0x40012000, size: 0x100}
  - {name: ADC2, model: stm32.adc, base: 0x40012100, size: 0x100}
  - {name: ADC3, model: stm32.adc, base: 0x40012200, size: 0x100}
  - {name: C_ADC, model: stm32.adc_common, base: 0x40012300, size: 0x400}   # ADC common registers (SVD extent 0x400)
  - {name: SDIO, model: stm32.sdio, base: 0x40012C00, size: 0x400}   # SD card host (card: --sd-card / board devices)
  - {name: SPI1, model: stm32.spi, base: 0x40013000, size: 0x400}
  - {name: SPI4, model: stm32.spi, base: 0x40013400, size: 0x400}   # SPI mode only (no I2S on SPI4-6)
  - {name: SYSCFG, model: stm32.syscfg, base: 0x40013800, size: 0x400}
  - {name: EXTI, model: stm32.exti, base: 0x40013C00, size: 0x400}
  - {name: TIM9, model: stm32.tim, base: 0x40014000, size: 0x400}
  - {name: TIM10, model: stm32.tim, base: 0x40014400, size: 0x400}
  - {name: TIM11, model: stm32.tim, base: 0x40014800, size: 0x400}
  - {name: SPI5, model: stm32.spi, base: 0x40015000, size: 0x400}
  - {name: SPI6, model: stm32.spi, base: 0x40015400, size: 0x400}
  - {name: SAI1, model: stm32.sai, base: 0x40015800, size: 0x400}   # serial audio interface, blocks A/B (RM0090 ch. 29)
  # AHB1
  - {name: GPIOA, model: stm32.gpio, base: 0x40020000, size: 0x400, params: {port: A}}
  - {name: GPIOB, model: stm32.gpio, base: 0x40020400, size: 0x400, params: {port: B}}
  - {name: GPIOC, model: stm32.gpio, base: 0x40020800, size: 0x400, params: {port: C}}
  - {name: GPIOD, model: stm32.gpio, base: 0x40020C00, size: 0x400, params: {port: D}}
  - {name: GPIOE, model: stm32.gpio, base: 0x40021000, size: 0x400, params: {port: E}}
  - {name: GPIOF, model: stm32.gpio, base: 0x40021400, size: 0x400, params: {port: F}}
  - {name: GPIOG, model: stm32.gpio, base: 0x40021800, size: 0x400, params: {port: G}}
  - {name: GPIOH, model: stm32.gpio, base: 0x40021C00, size: 0x400, params: {port: H}}
  - {name: GPIOI, model: stm32.gpio, base: 0x40022000, size: 0x400, params: {port: I}}
  - {name: GPIOJ, model: stm32.gpio, base: 0x40022400, size: 0x400, params: {port: J}}   # pins only on 176/208/216-pin packages
  - {name: GPIOK, model: stm32.gpio, base: 0x40022800, size: 0x400, params: {port: K}}
  - {name: CRC, model: stm32.crc, base: 0x40023000, size: 0x400}
  - {name: RCC, model: stm32.rcc_f42x, base: 0x40023800, size: 0x400, params: {ext_hz: 8000000}}   # + PLLSAI, DCKCFGR (RM0090 ch. 6)
  - {name: FLASH, model: stm32.flash_f42x, base: 0x40023C00, size: 0x400}   # dual-bank interface (RM0090 3.9)
  - {name: DMA1, model: stm32.dma, base: 0x40026000, size: 0x400, params: {controller: 1}}   # no memory-to-memory (RM0090 10.3.6)
  - {name: DMA2, model: stm32.dma, base: 0x40026400, size: 0x400, params: {controller: 2}}
  - {name: Ethernet_MAC, model: stm32.eth, base: 0x40028000, size: 0x1400}   # ETH MAC/MMC/PTP/DMA (all F427/F437 parts)
  - {name: DMA2D, model: stm32.dma2d, base: 0x4002B000, size: 0xC00}   # Chrom-ART: registers + FG/BG CLUT memories (RM0090 ch. 11)
  - {name: OTG_HS, model: stm32.otg_hs, base: 0x40040000, size: 0x40000}   # USB OTG HS core (256 KB window; embedded FS PHY only)
  # AHB2
  - {name: OTG_FS, model: stm32.otg_fs, base: 0x50000000, size: 0x40000}   # USB OTG FS core (256 KB window, device mode)
  - {name: DCMI, model: stm32.dcmi, base: 0x50050000, size: 0x400}
  - {name: CRYP, model: stm32.cryp, base: 0x50060000, size: 0x400, params: {only: [STM32F437, STM32F439], gcm: true}}   # STM32F437/439 only; + GCM/CCM (RM0090 23.3)
  - {name: HASH, model: stm32.hash, base: 0x50060400, size: 0x400, params: {only: [STM32F437, STM32F439], sha2: true}}   # STM32F437/439 only; + SHA-224/256 (RM0090 25.3)
  - {name: RNG, model: stm32.rng, base: 0x50060800, size: 0x400}
  # AHB3
  - {name: FMC, model: stm32.fmc, base: 0xA0000000, size: 0x1000}   # FMC control registers; NOR/PSRAM 0x60000000, SDRAM banks 0xC0000000/0xD0000000
  # Cortex-M4 debug MCU
  - {name: DBGMCU, model: stm32.dbgmcu, base: 0xE0042000, size: 0x400, params: {idcode: 0x20036419}}   # DEV_ID 0x419, REV_ID 0x2003 (rev 4/5/B, RM0090 38.6.1)

# SVD blocks that the STM32F427/F437 do not have (LCD-TFT is STM32F429/F439 only, DS9405 section 2).
omitted:
  - {name: LTDC, irqs: [88, 89], reason: "LCD-TFT controller: STM32F429/F439 only (DS9405 Table 2, RM0090 ch. 16)"}

# External interrupt numbers (exception = 16 + n), RM0090 Table 63; names from the SVD (48 FMC: "FSMC" in the RM).
# 87 SAI1 and 90 DMA2D are missing from STM32F427.svd (present in RM0090 Table 63 and in STM32F429.svd).
