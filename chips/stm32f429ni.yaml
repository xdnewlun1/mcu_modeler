# STMicroelectronics STM32F429NI (STM32F429, DS9405 Rev 14; Cortex-M4F, 180 MHz, 2048 KB dual-bank flash, 256 KB RAM incl. 64 KB
# CCM, LCD-TFT controller, TFBGA216). Section 8 ordering information: N = 216 balls, I = 2048 KB, H = BGA.
# Same die (DEV_ID 0x419), memory map, peripherals and IRQs as chips/stm32f429zi.yaml, which is included below;
# this file overrides name, package and pins.
# Check with: tools/pin_table_check.py chips/stm32f429ni.yaml --expect 216
include: stm32f429zi.yaml
name: STM32F429NI
package: TFBGA216
regs_file: stm32f427_regs.yaml

# Pin table (TFBGA216, not in the F427/F437 files): positions and pin types from ST's STM32_open_pin_data @ 7d1f1514
# (mcu/STM32F429NIHx.xml, svd/dl-open-pin-data-f429/), checked against DS9405 Rev 14 Table 10 (TFBGA216 column, pdftotext -layout):
# 0 differences for the 168 GPIOs and the 48 supply/system pins. GPIO functions: the DS9405 Table 10/12 entries of
# the F427/F437 files for the 140 GPIOs they have; PI12-PI15, PJ0-PJ15, PK0-PK7 (only on LQFP208/TFBGA216) from DS9405
# Table 12 (LCD_* on AF14, EVENTOUT on AF15; no other function). LCD AFs as in chips/stm32f429zi.yaml.
# Ball numbering: `num` = row-major index over the 216 balls (rows A..R without I and O, columns 1..15), `ball` = the ball name.
# All 216 package pins (168 GPIOs).
pins:
