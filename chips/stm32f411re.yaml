  - {num: 36, name: PB15, kind: gpio, port: B, bit: 15, default: GPIO, functions: {AF0: RTC_REFIN, AF1: TIM1_CH3N, AF5: SPI2_MOSI/I2S2_SD, AF12: SDIO_CK, AF15: EVENTOUT}}
