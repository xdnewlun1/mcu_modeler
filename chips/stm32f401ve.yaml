# STMicroelectronics STM32F401VE (STM32F401xD/E, Cortex-M4F, 84 MHz, 512 KB flash, 96 KB SRAM, LQFP100; the
# STM32F401C-DISCO has the F401VC). Same die, memory, peripherals and IRQs as chips/stm32f401re.yaml (included); this
# file overrides name, package and pins. Checked against RM0368 Rev 6;
# pins not checked against DS10086 (not in the repository).
include: stm32f401re.yaml
name: STM32F401VE
package: LQFP100
regs_file: stm32f401_regs.yaml

