# STMicroelectronics STM32F429II (STM32F429, DS9405 Rev 14; Cortex-M4F, 180 MHz, 2048 KB dual-bank flash, 256 KB RAM incl. 64 KB
# CCM, LCD-TFT controller, LQFP176). Section 8 ordering information: I = 176 pins, I = 2048 KB.
# Same die (DEV_ID 0x419), memory map, peripherals and IRQs as chips/stm32f429zi.yaml, which is included below;
# this file overrides name, package and pins.
include: stm32f429zi.yaml
name: STM32F429II
package: LQFP176
regs_file: stm32f427_regs.yaml

# Pin table: the STM32F427/F437 tables of DS9405 Rev 14 Table 10/12 (see chips/stm32f427vg.yaml and chips/README.md)
# plus the LCD_* alternate functions of DS9405 Table 12 (AF9 / AF14), which the F427 files leave out. The LCD AF numbers
# were taken from ST's STM32_open_pin_data @ 7d1f1514 (IP/GPIO-STM32F427_gpio_v1_0_Modes.xml, LTDC_* signals, cached in
# svd/dl-open-pin-data-f429/) and agree with DS9405 Table 12 parsed with pdftotext -bbox: 81 LCD AF entries on 79 GPIOs,
# 0 differences. Pin/ball positions: 0 differences against mcu/STM32F429IITx.xml and its STM32F439 counterpart.
# All 176 package pins (140 GPIOs).
