# P89CV51RB2/RC2/RD2 SFR table, HAND-WRITTEN (NXP publishes no SVD for its 80C51 parts).
# Same schema as tools/svd2chip.py output (chips/README.md) so chipem.regtable.regs_for() reads it unchanged.
# Generated once by a transcription script from the data sheet P89CV51RB2_RC2_RD2 Rev. 03 (25 August 2009,
# docs/datasheets/nxp/P89CV51RB2_RC2_RD2.pdf): Table 4 'Special function registers' (pp. 10-12) for every address
# and bit name, the per-register tables (cited per register) for reset values.  Table 4 lists no reset values; where
# no per-register table gives one, the 80C51 family value is used and marked (SP 07H, ports FFH, others 00H).
# MCS-51 convention (docs/CONTRACTS.md 'MCS-51 address spaces'): every block's base is the SFR space tag 0x30000,
# size 0x100, and a register's offset IS its SFR address (0x80-0xFF); blocks are sparse (only their registers are
# mapped).  Bit-addressable SFRs (address a multiple of 8) have bit addresses = address + bit number.
device: P89CV51RD2
svd_version: "hand-written"
address_unit_bits: 8
cpu: {name: 80C51, fpu: false}
interrupts:                 # interrupt number n -> vector 8n+3 (data sheet Table 41 p.53)
  0: INT0
  1: TIMER0
  2: INT1
  3: TIMER1
  4: SERIAL
  6: PCA
  7: TIMER2
peripherals:
  CPU:
    base: 0x30000
    size: 0x100
    derived_from: null
    description: "CPU registers kept in the core (arch-owned block)"
    group: CPU
    registers:
      - {name: SP, offset: 0x81, width: 1, reset: 0x07, reset_mask: 0xFF, access: read-write, description: "Table 4 p.12; reset 07H: 80C51 family (not listed in this data sheet)"}
      - {name: DPL, offset: 0x82, width: 1, reset: 0x00, reset_mask: 0xFF, access: read-write, description: "Table 4 p.11"}
      - {name: DPH, offset: 0x83, width: 1, reset: 0x00, reset_mask: 0xFF, access: read-write, description: "Table 4 p.11"}
      - {name: AUXR1, offset: 0xA2, width: 1, reset: 0x00, reset_mask: 0xFF, access: read-write, description: "Table 4 p.10, Table 8/9 p.16 (reset 00H)", fields: [
          {name: ENBOOT, lsb: 5, width: 1},
          {name: GF2, lsb: 3, width: 1},
          {name: ZERO2, lsb: 2, width: 1, access: read-only},
          {name: DPS, lsb: 0, width: 1},
        ]}
      - {name: PSW, offset: 0xD0, width: 1, reset: 0x00, reset_mask: 0xFF, access: read-write, description: "Table 4 p.11", fields: [
          {name: CY, lsb: 7, width: 1},
          {name: AC, lsb: 6, width: 1},
          {name: F0, lsb: 5, width: 1},
          {name: RS1, lsb: 4, width: 1},
          {name: RS0, lsb: 3, width: 1},
          {name: OV, lsb: 2, width: 1},
          {name: F1, lsb: 1, width: 1},
          {name: P, lsb: 0, width: 1, access: read-only},
        ]}
      - {name: ACC, offset: 0xE0, width: 1, reset: 0x00, reset_mask: 0xFF, access: read-write, description: "Table 4 p.10"}
      - {name: B, offset: 0xF0, width: 1, reset: 0x00, reset_mask: 0xFF, access: read-write, description: "Table 4 p.10"}
  INTC:
    base: 0x30000
    size: 0x100
    derived_from: null
    description: "Interrupt enable / priority (arch-owned block)"
    group: INTC
    registers:
      - {name: IE, offset: 0xA8, width: 1, reset: 0x00, reset_mask: 0xFF, access: read-write, description: "Table 4 p.11, Table 42/43 p.54 (reset 00H)", fields: [
