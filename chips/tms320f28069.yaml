# TI TMS320F28069 (Piccolo F2806x: C28x + FPU32 + VCU, 90 MHz), 100-pin LQFP "PZ".  The LAUNCHXL-F28069M part is the
# F28069M (InstaSPIN-MOTION ROM, USB): chips/tms320f28069m.yaml.
# Sources: data sheet docs/datasheets/ti/tms320f28069.pdf = SPRS698J (Sep 2021): Table 5-1 (device comparison: 128K-word
# flash, 50K-word SARAM = M0/M1 + L0-L8, 1K OTP, 32K boot ROM, CLA, 6-channel DMA, ePWM1-8 (HRPWM on 1A-4A, 8 HR
# channels), eCAP1-3, HRCAP1-4, eQEP1/2, 16 ADC channels, COMP1-3, SPI-A/B, SCI-A/B, I2C-A, McBSP-A, eCAN-A, 54 GPIOs + 6
# AIOs; USB only on the U/M/F parts), Figure 8-1 (memory map), Table 8-3 (flash sectors), Tables 8-6..8-9 (peripheral
# frames), Table 8-10 (PARTID 0x009E at 0x3D7E80), PIE table, Table 8-1 (boot modes).  Behaviour: SPRUH18I (TMS320x2806x
# TRM, svd/c28x-docs/dl19), chips/README.md.  Register table chips/tms320f2806x_regs.yaml (tools/gen_piccolo_regs.py;
# --check-ds: 798 data sheet addresses, 0 mismatches).  Pin table: SPRS698 terminal functions / pin assignment / GPIO
# mux tables, cross-checked against SPRUH18 (0 differences).  Address units are 16-bit words.
# LAUNCHXL-F28069M (SPRUI11B): LEDs D9/D10 on GPIO34 / GPIO39, the XDS100 UART on SCI-A GPIO28/29 (JP6 on, JP7 off),
# CAN transceiver (SN65HVD234) on GPIO30 (CANRXA) / GPIO31 (CANTXA), boot switch S1 = GPIO34 / GPIO37 / TRST, no crystal.
name: TMS320F28069
package: LQFP100 (PZ)
family: ti_c2000
regs_file: tms320f2806x_regs.yaml
gpio_name_format: "GPIO{num}"          # port A = GPIO0-31, port B = GPIO32-58
core: {arch: c28x, backend: c28x, cpu: c28x, fpu: true, clock_hz: 10000000, addr_unit_bits: 16, num_irqs: 0}

# Reset: boot ROM stand-in chips/tms320f2806x_bootrom.asm (same flow as the F2802x one; InitBoot at 0x3FF3B0) unless the
# image has an entry point.
boot:
  entry: 0x3FF3B0
  sp: 0x0400
  rom_words:                           # tools/gen_piccolo_regs.py --bootrom-words chips/tms320f2806x_bootrom.asm
    0x3D7C80: [
      0x7622, 0x761F, 0x01C5, 0x2B00, 0x2B01, 0x761F, 0x01C0, 0x2B14, 0x2B16, 0x761A, 0x0006,
    ]
    0x3D7CC0: [
      0x8F3D, 0x7BFE, 0x9284, 0x1BA9, 0x55AA, 0x600A, 0x92C4, 0x5201, 0x6108, 0x5204, 0x6106, 0x5205,
      0x6104, 0x5206, 0x6102, 0x9A0B, 0x0006,
    ]
    0x3FF3B0: [
      0x8D7F, 0x7FF8, 0x9281, 0x9281, 0x9281, 0x9281, 0x9281, 0x9281, 0x9281, 0x9281, 0x7622, 0x761F,
      0x01C0, 0x1A1C, 0x0008, 0x767D, 0x7C80, 0x7622, 0x761F, 0x01C0, 0x181C, 0xFFF7, 0x1A11, 0x0180,
      0x761F, 0x0034, 0x2800, 0x55AA, 0x761F, 0x01BF, 0x4508, 0x6C13, 0x4208, 0x6C0C, 0x761F, 0x0034,
      0x2801, 0x0003, 0x767D, 0x7CC0, 0x5206, 0x6114, 0x520B, 0x6115, 0x6F17, 0x761F, 0x0034, 0x2801,
      0x0002, 0x6F12, 0x4208, 0x6C06, 0x761F, 0x0034, 0x2801, 0x0001, 0x6F0B, 0x761F, 0x0034, 0x2B01,
      0x6F07, 0x76FD, 0x7800, 0x6F0B, 0x76FF, 0x7FF6, 0x6F08, 0x7622, 0x761F, 0x01C0, 0x2829, 0x0068,
      0x761A, 0x6F00, 0x0200, 0x8D00, 0x0000, 0x8D40, 0x0000, 0x8D80, 0x0000, 0x8DC0, 0x0000, 0x8F00,
      0x0000, 0x8F40, 0x0000, 0x7680, 0x0000, 0x761F, 0x0000, 0x761A, 0x7620, 0x7622, 0x761F, 0x01C0,
      0x2829, 0x0028, 0x761A, 0x6F00,
    ]
    0x3FFFC0: [
      0xF3B0, 0x003F, 0x0042, 0x0000, 0x0044, 0x0000, 0x0046, 0x0000, 0x0048, 0x0000, 0x004A, 0x0000,
      0x004C, 0x0000, 0x004E, 0x0000, 0x0050, 0x0000, 0x0052, 0x0000, 0x0054, 0x0000, 0x0056, 0x0000,
      0x0058, 0x0000, 0x005A, 0x0000, 0x005C, 0x0000, 0x005E, 0x0000, 0x0060, 0x0000, 0x0062, 0x0000,
      0x0064, 0x0000, 0xF40D, 0x003F, 0x0068, 0x0000, 0x006A, 0x0000, 0x006C, 0x0000, 0x006E, 0x0000,
      0x0070, 0x0000, 0x0072, 0x0000, 0x0074, 0x0000, 0x0076, 0x0000, 0x0078, 0x0000, 0x007A, 0x0000,
      0x007C, 0x0000, 0x007E, 0x0000,
    ]
auto_stub_ranges: [[0x0800, 0x0FFF], [0x1000, 0x5FFF], [0x6000, 0x7FFF]]   # unmodelled PF0-PF3 registers: RAM-like stubs

memory:
  - {name: M0, base: 0x000000, size: 0x0400, kind: ram}
  - {name: M1, base: 0x000400, size: 0x0400, kind: ram}
  - {name: CLAMSGRAM, base: 0x001480, size: 0x0100, kind: ram}  # CLA-to-CPU / CPU-to-CLA message RAMs (CLA not run)
  - {name: L0L8, base: 0x008000, size: 0xC000, kind: ram}      # L0 2K, L1 1K, L2 1K, L3 4K (CLA RAMs), L4 8K, L5-L8 8K each
  - {name: OTP, base: 0x3D7800, size: 0x0680, kind: rom, fill: 0xFF}     # user OTP + TI calibration (Device_cal, Get_mode)
  - {name: OTP2, base: 0x3D7EC0, size: 0x0140, kind: rom, fill: 0xFF}    # TI calibration data (0x3D7E80-0x3D7EBF: PARTID block)
  - {name: FLASH, base: 0x3D8000, size: 0x20000, kind: flash, fill: 0xFF}  # sectors H..A (16K each, Table 8-3)
  - {name: BOOTROM, base: 0x3F8000, size: 0x8000, kind: rom, fill: 0xFF}   # boot ROM 32K; CPU vectors at 0x3FFFC0

peripherals:
  - {name: PARTID, model: ti_c2000.partid, base: 0x3D7E80, size: 0x40, params: {partid_offset: 0, value: 0x009E, words: {2: 0xFF20, 3: 0x170A, 4: 0x0006, 5: 0xFF20, 6: 0x06D6, 7: 0x0006}}}   # SPRS698 Table 8-10: F28069PZ; words: getTempSlope/Offset (bootrom asm)
  # Peripheral Frame 0
  - {name: DEV_EMU, model: ti_c2000.storage, base: 0x0880, size: 0x105}   # DEVICECNF, CLASSID 0x009F, REVID
  - {name: BORCFG, model: ti_c2000.storage, base: 0x0985, size: 0x3}
  - {name: FLASHREGS, model: ti_c2000.flash, base: 0x0A80, size: 0x60, params: {regs: FLASH}}
  - {name: CSM, model: ti_c2000.csm, base: 0x0AE0, size: 0x10,
     params: {pwl_base: 0x3F7FF8, secure_ranges: [[0x8000, 0xC000], [0x3D7800, 0x3D7C00], [0x3D8000, 0x3F8000]]}}   # L0-L4, OTP, flash
  - {name: ADCRESULT, model: ti_c2000.adc_soc_result, base: 0x0B00, size: 0x10}
  - {name: CPUTIMER0, model: ti_c2000.cputimer, base: 0x0C00, size: 0x8, params: {index: 0}}
  - {name: CPUTIMER1, model: ti_c2000.cputimer, base: 0x0C08, size: 0x8, params: {index: 1}}
  - {name: CPUTIMER2, model: ti_c2000.cputimer, base: 0x0C10, size: 0x8, params: {index: 2}}
  - {name: PIE, model: ti_c2000.pie, base: 0x0CE0, size: 0x120}
  - {name: DMA, model: ti_c2000.dma, base: 0x1000, size: 0x200, params: {gate: DMAENCLK, epwm_first: 2, epwm_last: 7}}
  - {name: CLA1, model: ti_c2000.cla, base: 0x1400, size: 0x80}   # storage: the CLA is not emulated
  # Peripheral Frame 3
  - {name: MCBSPA, model: ti_c2000.mcbsp, base: 0x5000, size: 0x40, params: {gate: MCBSPAENCLK}}
  - {name: COMP1, model: ti_c2000.comp, base: 0x6400, size: 0x20, params: {index: 1, ramp: true}}
  - {name: COMP2, model: ti_c2000.comp, base: 0x6420, size: 0x20, params: {index: 2, ramp: true}}
  - {name: COMP3, model: ti_c2000.comp, base: 0x6440, size: 0x20, params: {index: 3, ramp: true}}
  - {name: EPWM1, model: ti_c2000.epwm_dc, base: 0x6800, size: 0x40, params: {gate: EPWM1ENCLK, index: 1, hrpwm: true, mep_step_ps: 150, sync_next: [EPWM2]}}
  - {name: EPWM2, model: ti_c2000.epwm_dc, base: 0x6840, size: 0x40, params: {gate: EPWM2ENCLK, index: 2, hrpwm: true, mep_step_ps: 150, sync_next: [EPWM3]}}
  - {name: EPWM3, model: ti_c2000.epwm_dc, base: 0x6880, size: 0x40, params: {gate: EPWM3ENCLK, index: 3, hrpwm: true, mep_step_ps: 150, sync_next: [EPWM4]}}
  - {name: EPWM4, model: ti_c2000.epwm_dc, base: 0x68C0, size: 0x40, params: {gate: EPWM4ENCLK, index: 4, hrpwm: true, mep_step_ps: 150, sync_next: [EPWM5]}}
  - {name: EPWM5, model: ti_c2000.epwm_dc, base: 0x6900, size: 0x40, params: {gate: EPWM5ENCLK, index: 5, hrpwm: true, mep_step_ps: 150, sync_next: [EPWM6]}}
  - {name: EPWM6, model: ti_c2000.epwm_dc, base: 0x6940, size: 0x40, params: {gate: EPWM6ENCLK, index: 6, hrpwm: true, mep_step_ps: 150, sync_next: [EPWM7]}}
  - {name: EPWM7, model: ti_c2000.epwm_dc, base: 0x6980, size: 0x40, params: {gate: EPWM7ENCLK, index: 7, hrpwm: true, mep_step_ps: 150, sync_next: [EPWM8]}}
  - {name: EPWM8, model: ti_c2000.epwm_dc, base: 0x69C0, size: 0x40, params: {gate: EPWM8ENCLK, index: 8, hrpwm: true, mep_step_ps: 150, sync_next: []}}
  - {name: ECAP1, model: ti_c2000.ecap, base: 0x6A00, size: 0x20, params: {gate: ECAP1ENCLK, index: 1}}
  - {name: ECAP2, model: ti_c2000.ecap, base: 0x6A20, size: 0x20, params: {gate: ECAP2ENCLK, index: 2}}
  - {name: ECAP3, model: ti_c2000.ecap, base: 0x6A40, size: 0x20, params: {gate: ECAP3ENCLK, index: 3}}
  - {name: EQEP1, model: ti_c2000.eqep, base: 0x6B00, size: 0x40, params: {gate: EQEP1ENCLK, index: 1}}
  - {name: EQEP2, model: ti_c2000.eqep, base: 0x6B40, size: 0x40, params: {gate: EQEP2ENCLK, index: 2}}
  # Peripheral Frame 1
  - {name: ECANA, model: ti_c2000.ecan, base: 0x6000, size: 0x200, params: {gate: ECANAENCLK, clock_div: 2}}   # SPRUH18 Table 1-15: eCAN-A clocked at SYSCLKOUT/2
  - {name: HRCAP1, model: ti_c2000.storage, base: 0x6AC0, size: 0x20, params: {gate: HRCAP1ENCLK}}   # HRCAP: register storage only
  - {name: HRCAP2, model: ti_c2000.storage, base: 0x6AE0, size: 0x20, params: {gate: HRCAP2ENCLK}}
  - {name: HRCAP3, model: ti_c2000.storage, base: 0x6C80, size: 0x20, params: {gate: HRCAP3ENCLK}}
  - {name: HRCAP4, model: ti_c2000.storage, base: 0x6CA0, size: 0x20, params: {gate: HRCAP4ENCLK}}
  - {name: GPIO, model: ti_c2000.piccolo_gpio, base: 0x6F80, size: 0x80}
  # Peripheral Frame 2
  - {name: SYSCTRL, model: ti_c2000.piccolo_sysctrl, base: 0x7010, size: 0x30, params: {intosc1_hz: 10000000, intosc2_hz: 10000000, xtal_hz: 0, max_div: 18}}   # incl. PLL2/EPWMCFG (storage)
  - {name: SPIA, model: ti_c2000.spi, base: 0x7040, size: 0x10, params: {gate: SPIAENCLK, fifo_depth: 4}}
  - {name: SCIA, model: ti_c2000.sci, base: 0x7050, size: 0x10, params: {fifo_depth: 4}}
  - {name: NMIINT, model: ti_c2000.nmiwd, base: 0x7060, size: 0x10}
  - {name: XINT, model: ti_c2000.xint, base: 0x7070, size: 0x10}
  - {name: ADC, model: ti_c2000.adc_soc, base: 0x7100, size: 0x80, params: {triggers: 20, vrefhi_pin: VREFHI}}
  - {name: SPIB, model: ti_c2000.spi, base: 0x7740, size: 0x10, params: {gate: SPIBENCLK, fifo_depth: 4}}
  - {name: SCIB, model: ti_c2000.sci, base: 0x7750, size: 0x10, params: {fifo_depth: 4}}
  - {name: I2CA, model: ti_c2000.i2c, base: 0x7900, size: 0x40, params: {gate: I2CAENCLK, fifo_depth: 4}}

