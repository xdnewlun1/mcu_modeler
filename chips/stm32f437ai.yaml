# STMicroelectronics STM32F437AI (STM32F437 = STM32F427 + cryptographic processor (CRYP, with GCM/GMAC/CCM) and hash
# processor (HASH, with SHA-224/SHA-256/HMAC), Cortex-M4F, 180 MHz, 2 MB dual-bank flash, 256 KB RAM incl. 64 KB CCM,
# UFBGA169). DS9484 Rev 14 (STM32F437xx/STM32F439xx data sheet), section 8 ordering information: A = 169 pins,
# I = 2048 KB, H = BGA. Same die (DEV_ID 0x419) as chips/stm32f427vg.yaml, which is included below.
include: stm32f427vg.yaml
name: STM32F437AI
package: UFBGA169
regs_file: stm32f427_regs.yaml

memory:
  - {name: FLASH, base: 0x08000000, size: 0x200000, kind: flash}   # 2 MB: bank 1 sectors 0-11, bank 2 sectors 12-23
  - {name: CCMRAM, base: 0x10000000, size: 0x10000, kind: ram}
  - {name: SRAM, base: 0x20000000, size: 0x30000, kind: ram}       # SRAM1 112 KB + SRAM2 16 KB + SRAM3 64 KB
  - {name: BKPSRAM, base: 0x40024000, size: 0x1000, kind: ram}

# Pin table: generated from DS9405 Rev 14 (STM32F427xx/429xx) Table 10 "pin and ball definitions" (pages 53-71) and
# Table 12 "alternate function mapping" AF0..AF15 (pages 75-86) with pdftotext -bbox word coordinates; DS9484 Rev 14
# (STM32F437xx/439xx) Tables 10/12 parse to identical tables (0 differences). Table 10 "Additional functions" give the
# ADC / analog / additional keys. LCD_* alternate functions (LTDC, STM32F429/F439 only) are left out.
# Cross-checked against ST's STM32_open_pin_data @ 7d1f1514 (mcu/STM32F427V(G-I)Tx.xml, STM32F427Z(G-I)Tx.xml,
# STM32F427I(G-I)Tx.xml, STM32F427I(G-I)Hx.xml, STM32F427A(G-I)Hx.xml, STM32F437AIHx.xml, IP/GPIO-STM32F427_gpio_v1_0_Modes.xml,
# cached in svd/dl-open-pin-data-f42x/): 0 differences in pin/ball positions for every package and 0 differences in
# AF numbers for all 168 GPIOs (names differ only in ST's spelling: ETH_CRS vs ETH_MII_CRS, USB_OTG_* vs OTG_*, ...).
# Data sheet corrections: UART7_Tx/UART7_Rx/UART8_Tx/UART8_Rx (mixed case in DS Table 10/12) written UART7_TX/... ;
# PH6/PH7 AF15 is EVENTOUT (Table 12 prints "-"; Table 10 and ST's open pin data list EVENTOUT on every GPIO).
# Ball numbering: `num` = row-major index over the 13 x 13 balls (rows A..N without I, columns 1..13; A1 = 1,
# N13 = 169), `ball` = the ball name. The four corner balls A1, A13, N1, N13 are NC (DS9484 Figure 16 note 2 and Table 10
# note 3: "NC (not-connected) pins are not bonded"). Check with: tools/pin_table_check.py chips/stm32f437ai.yaml
# All 169 balls (130 GPIOs, DS9484 Table 2; UFBGA169 column of Table 10).
pins:
  - {num: 1, ball: A1, name: NC, kind: special, default: NC}
  - {num: 2, ball: A2, name: PI6, kind: gpio, port: I, bit: 6, default: GPIO, functions: {AF3: TIM8_CH2, AF12: FMC_D28, AF13: DCMI_D6, AF15: EVENTOUT}}
