# Medium-density performance line, DEV_ID 0x410 (RM0008 31.6.1).  Base file of the medium-density F103 parts:
# the package variants (stm32f103{t8,tb,c8,cb,r8,rb,v8}.yaml) include it and override name, package, memory, pins.
# Memory map, register boundary addresses and IRQs: RM0008 Rev 21 3.3 (Table 3), 10.1.2 Table 63; CMSIS-SVD
# STM32F103xx.svd (cmsis-svd-data @ c65f8551, chips/stm32f103_regs.yaml) for bases and register layouts.

# Pin table generated from ST's STM32_open_pin_data @ 7d1f1514 (mcu/STM32F103V(8-B)Tx.xml positions and signals, mcu/IP/GPIO-STM32F103x8_gpio_v1_0_Modes.xml
# default / remap classification; svd/dl-open-pin-data-f1/) and checked against the RM0008 9.3 remap tables (Tables 34,
# 43-46, 52-56); see chips/README.md "STM32F103 medium / high density".
name: STM32F103VB
package: LQFP100
family: stm32f1
regs_file: stm32f103_regs.yaml
gpio_name_format: "P{port}{bit}"
# 8 MHz = HSI after reset; stm32f1.rcc derives HCLK from CFGR/PLL and retunes the clock (72 MHz max with HSE x 9).
core: {arch: armv7-m, backend: unicorn, cpu: cortex-m3, fpu: false, clock_hz: 8000000, addr_unit_bits: 8, num_irqs: 43}
# SysTick CLKSOURCE=0 reference: HCLK/8 (RM0008 Figure 8 clock tree "to Cortex System timer /8").
systick_ext_div: 8
# SYST_CALIB: RM0008 10.1.1 "The SysTick calibration value is set to 9000" (TENMS = 9000 HCLK/8 ticks = 1 ms at 72 MHz),
# NOREF = SKEW = 0.
systick_calib: 9000
# BOOT0 = 0: the vector table is fetched through the alias at 0x00000000; CHIP_EM does not map the alias, so VTOR
# starts at the flash base (images are linked at 0x08000000).
vtor: 0x08000000

memory:
  - {name: FLASH, base: 0x08000000, size: 0x20000, kind: flash}     # 128 KB main flash
  - {name: SRAM, base: 0x20000000, size: 0x5000, kind: ram}        # 20 KB
  # System memory 0x1FFFF000 (2 KB, ST bootloader; F_SIZE at 0x1FFFF7E0, unique ID at 0x1FFFF7E8) and option
  # bytes 0x1FFFF800 are MMIO blocks (SYSMEM, OB) below, not plain memory.

