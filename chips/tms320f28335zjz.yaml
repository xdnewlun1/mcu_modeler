# TI TMS320F28335 in the 176-ball ZJZ plastic BGA (15 x 15 mm).
# Same die, memory map, peripherals and IRQs as chips/tms320f28335.yaml (LQFP176), which is included; this file
# overrides name, package and pins.  Ball table generated from SPRS439Q Table 6-1 (the ZJZ ball column next to each
# PGF pin number; names and functions = the LQFP176 pin with that number) and cross-checked against the ballout
# figures (Figures 6-6..6-9, pdftotext -bbox, cells matched by row/column label): 176 of 176 balls carry the same signal
# names.  ZJZ has no ball for LQFP pin 167 (VDD) and one extra VDDIO ball, N14 (Table 6-1).
# Ball numbering: `num` = row-major index over the 176 balls (rows A..P without I/O, columns 1..14), `ball` = the
# ball name.  Check with: tools/pin_table_check.py chips/tms320f28335zjz.yaml --expect 176 --strict
