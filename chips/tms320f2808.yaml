# TI TMS320F2808 (280x: fixed-point C28x, no FPU, 100 MHz), 100-pin LQFP "PZ".
# Sources (docs/datasheets/ti/tms320f2808.pdf = SPRS230P, Rev. P, Feb 2021): Table 6-1 (F2808: 64K-word flash,
# 18K SARAM = M0/M1/L0/L1/H0, 1K OTP, 4K boot ROM, ePWM1-6 with HRPWM on ePWM1A-4A, eCAP1-4, eQEP1/2, SPI-A..D,
# SCI-A/B, eCAN-A/B, I2C-A, 35 GPIOs, 3 external interrupts), Table 7-1 (PZ pin numbers and GGM/ZGM balls),
# Figure 7-1 (PZ pinout), Table 9-17 (GPIO mux), Figure 9-19 (F2808 memory map), Table 9-19 (flash sectors),
# Tables 9-24..9-27 (peripheral frames, PARTID), Table 9-28 (PIE interrupts), Table 9-1 (boot modes).
# Behaviour: SPRU712H (280x system control and interrupts), SPRU722C (boot ROM), the 280x peripheral guides
# (svd/c28x-docs, chips/README.md).  Register table: chips/tms320f2808_regs.yaml (generated by
# tools/gen_tms320f2808_regs.py, checked against the data sheet tables: 551 registers, 0 mismatches).
# Pin table: generated from Table 7-1 + Table 9-17 text (pdftotext -layout) and cross-checked: 100 unique pins 1..100,
# Table 7-1 functions == Table 9-17 MUX1-3 for all 35 GPIOs, all 100 pin labels of Figure 7-1 (pdftotext -bbox,
# matched by position) equal the names below, and SPRU712H Table 4-9 (2808 GPIO mux) gives 0 differences.
# Names join the GPIO and its MUX1-3 functions as in Figure 7-1 (GPIO28/29 have no MUX2: "GPIO29/SCITXDA/TZ6").
# Address units are 16-bit words (addr_unit_bits: 16): every base/size below counts words.
name: TMS320F2808
package: LQFP100 (PZ)
family: ti_c2000
regs_file: tms320f2808_regs.yaml
gpio_name_format: "GPIO{num}"          # port A = GPIO0-31, port B = GPIO32-34 (GPIO35 internal, not pinned out)
core: {arch: c28x, backend: c28x, cpu: c28x, fpu: false, clock_hz: 10000000, addr_unit_bits: 16, num_irqs: 0}

# Reset runs the boot ROM stand-in (chips/tms320f2808_bootrom.asm, seeded below) unless the image has an entry point
# (.c28img / TI .out: PC = entry, as if the boot ROM had jumped to flash).  InitBoot does the CSM dummy read and
# samples GPIO18/GPIO29/GPIO34 (SPRS230P Table 9-1): 111 -> flash 0x3F7FF6, 010 -> M0 0x000000, 001 -> OTP 0x3D7800,
# 110 SCI-A (autobaud), 101 SPI-A EEPROM, 100 I2C-A EEPROM, 011 eCAN-A, 000 parallel GPIO loaders (SPRU722C; stream
# from tools/c28x_bootstream.py).  A loader-mode reset needs an image without an entry point, or none.
