auto_stub_ranges: [[0x0800, 0x0FFF], [0x6000, 0x7FFF]]   # unmodelled PF0/PF1/PF2 registers become RAM-like stubs

memory:
  - {name: M0, base: 0x000000, size: 0x0400, kind: ram}        # M0 SARAM (first 0x40 words: M0 vectors, VMAP=0)
  - {name: M1, base: 0x000400, size: 0x0400, kind: ram}        # M1 SARAM; SP = 0x0400 after reset
  - {name: L0L1H0, base: 0x008000, size: 0x4000, kind: ram}    # L0 (4K) + L1 (4K, both secure) + H0 (8K) SARAM,
                                                               # dual-mapped at 0x3F8000 (L01H0HI below)
  - {name: OTP, base: 0x3D7800, size: 0x0400, kind: rom, fill: 0xFF}       # 1K user OTP (secure)
  - {name: FLASH, base: 0x3E8000, size: 0x10000, kind: flash, fill: 0xFF}  # sectors D,C,B,A (16K each, Table 9-19);
                                                                           # 0x3F7FF6 entry, 0x3F7FF8-0x3F7FFF password
  - {name: BOOTROM, base: 0x3FF000, size: 0x1000, kind: rom, fill: 0xFF}   # boot ROM (4K); CPU vectors at 0x3FFFC0

peripherals:
  - {name: L01H0HI, model: ti_c2000.alias, base: 0x3F8000, size: 0x4000, params: {target: 0x8000}}  # program view
  # Peripheral Frame 0
  - {name: DEV_EMU, model: ti_c2000.storage, base: 0x0880, size: 0x180}    # DEVICECNF, PARTID 0x003C, REVID
  - {name: FLASHREGS, model: ti_c2000.flash, base: 0x0A80, size: 0x60, params: {regs: FLASH}}
  - {name: CSM, model: ti_c2000.csm, base: 0x0AE0, size: 0x10,
     params: {pwl_base: 0x3F7FF8, secure_ranges: [[0x8000, 0xA000], [0x3D7800, 0x3D7C00], [0x3E8000, 0x3F8000],
                                                  [0x3F8000, 0x3FA000]]}}   # L0/L1, OTP, flash, L0/L1 mirror
  - {name: ADCMIRROR, model: ti_c2000.adcmirror, base: 0x0B00, size: 0x10}
  - {name: CPUTIMER0, model: ti_c2000.cputimer, base: 0x0C00, size: 0x8, params: {index: 0}}
  - {name: CPUTIMER1, model: ti_c2000.cputimer, base: 0x0C08, size: 0x8, params: {index: 1}}
  - {name: CPUTIMER2, model: ti_c2000.cputimer, base: 0x0C10, size: 0x8, params: {index: 2}}
  - {name: PIE, model: ti_c2000.pie, base: 0x0CE0, size: 0x120}   # arch-owned (chipem/arch/c28x), incl. vectors
  # Peripheral Frame 1
  - {name: ECANA, model: ti_c2000.ecan, base: 0x6000, size: 0x200, params: {gate: ECANAENCLK, clock_div: 1}}  # 0x6100 mailboxes;
                                       # 280x eCAN clock = SYSCLKOUT (SPRUEU0 3.1.2; F2833x: SYSCLKOUT/2)
  - {name: ECANB, model: ti_c2000.ecan, base: 0x6200, size: 0x200, params: {gate: ECANBENCLK, clock_div: 1}}  # 0x6300 mailboxes
  - {name: EPWM1, model: ti_c2000.epwm, base: 0x6800, size: 0x40, params: {gate: EPWM1ENCLK, index: 1, hrpwm: true, mep_step_ps: 150}}
  - {name: EPWM2, model: ti_c2000.epwm, base: 0x6840, size: 0x40, params: {gate: EPWM2ENCLK, index: 2, hrpwm: true, mep_step_ps: 150}}
  - {name: EPWM3, model: ti_c2000.epwm, base: 0x6880, size: 0x40, params: {gate: EPWM3ENCLK, index: 3, hrpwm: true, mep_step_ps: 150}}
  - {name: EPWM4, model: ti_c2000.epwm, base: 0x68C0, size: 0x40, params: {gate: EPWM4ENCLK, index: 4, hrpwm: true, mep_step_ps: 150}}
  - {name: EPWM5, model: ti_c2000.epwm, base: 0x6900, size: 0x40, params: {gate: EPWM5ENCLK, index: 5}}
  - {name: EPWM6, model: ti_c2000.epwm, base: 0x6940, size: 0x40, params: {gate: EPWM6ENCLK, index: 6}}
  - {name: ECAP1, model: ti_c2000.ecap, base: 0x6A00, size: 0x20, params: {gate: ECAP1ENCLK, index: 1}}
  - {name: ECAP2, model: ti_c2000.ecap, base: 0x6A20, size: 0x20, params: {gate: ECAP2ENCLK, index: 2}}
  - {name: ECAP3, model: ti_c2000.ecap, base: 0x6A40, size: 0x20, params: {gate: ECAP3ENCLK, index: 3}}
  - {name: ECAP4, model: ti_c2000.ecap, base: 0x6A60, size: 0x20, params: {gate: ECAP4ENCLK, index: 4}}
  - {name: EQEP1, model: ti_c2000.eqep, base: 0x6B00, size: 0x40, params: {gate: EQEP1ENCLK, index: 1}}
  - {name: EQEP2, model: ti_c2000.eqep, base: 0x6B40, size: 0x40, params: {gate: EQEP2ENCLK, index: 2}}
  - {name: GPIO, model: ti_c2000.gpio, base: 0x6F80, size: 0x80}
  # Peripheral Frame 2
  - {name: SYSCTRL, model: ti_c2000.sysctrl, base: 0x7010, size: 0x20,
     params: {ext_hz: 20000000, max_hz: 100000000}}   # 20 MHz crystal: PLLCR = 10, CLKINDIV = 0 -> 100 MHz (TI 280x setup)
  - {name: SPIA, model: ti_c2000.spi, base: 0x7040, size: 0x10, params: {gate: SPIAENCLK}}   # PIE 6.1/6.2
  - {name: SCIA, model: ti_c2000.sci, base: 0x7050, size: 0x10}
  - {name: XINT, model: ti_c2000.xint, base: 0x7070, size: 0x10}           # XINT1, XINT2, XNMI
  - {name: ADC, model: ti_c2000.adc, base: 0x7100, size: 0x20, params: {adcclk_max_hz: 12500000}}  # ADCCLK <= 12.5 MHz (SPRS230P 8.x)
  - {name: SPIB, model: ti_c2000.spi, base: 0x7740, size: 0x10, params: {gate: SPIBENCLK}}   # PIE 6.3/6.4
  - {name: SCIB, model: ti_c2000.sci, base: 0x7750, size: 0x10}
  - {name: SPIC, model: ti_c2000.spi, base: 0x7760, size: 0x10, params: {gate: SPICENCLK}}   # PIE 6.5/6.6
  - {name: SPID, model: ti_c2000.spi, base: 0x7780, size: 0x10, params: {gate: SPIDENCLK}}   # PIE 6.7/6.8
  - {name: I2CA, model: ti_c2000.i2c, base: 0x7900, size: 0x40, params: {gate: I2CAENCLK}}

# Interrupts by vector number (PIE INTx.y = 32 + 8(x-1) + (y-1), table at 0x0D00 + 2n; 13/14 = CPU INT13/INT14),
# SPRS230P Table 9-28.  Groups 7, 10, 11 and 12 are unused on the 280x.
