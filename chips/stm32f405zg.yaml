  - {name: CAN2, model: stub, base: 0x40006800, size: 0x400}
  - {name: PWR, model: stm32.pwr, base: 0x40007000, size: 0x400}
  - {name: DAC, model: stm32.dac, base: 0x40007400, size: 0x400}
  # APB2
  - {name: TIM1, model: stm32.tim, base: 0x40010000, size: 0x400}
  - {name: TIM8, model: stm32.tim, base: 0x40010400, size: 0x400}
  - {name: USART1, model: stm32.usart, base: 0x40011000, size: 0x400, params: {index: 1, kind: usart}}
  - {name: USART6, model: stm32.usart, base: 0x40011400, size: 0x400, params: {index: 6, kind: usart}}
  - {name: ADC1, model: stm32.adc, base: 0x40012000, size: 0x100}
  - {name: ADC2, model: stm32.adc, base: 0x40012100, size: 0x100}
  - {name: ADC3, model: stm32.adc, base: 0x40012200, size: 0x100}
  - {name: C_ADC, model: stm32.adc_common, base: 0x40012300, size: 0x400}   # ADC common registers (SVD extent 0x400)
  - {name: SDIO, model: stub, base: 0x40012C00, size: 0x400}
  - {name: SPI1, model: stm32.spi, base: 0x40013000, size: 0x400}
  - {name: SYSCFG, model: stm32.syscfg, base: 0x40013800, size: 0x400}
  - {name: EXTI, model: stm32.exti, base: 0x40013C00, size: 0x400}
  - {name: TIM9, model: stm32.tim, base: 0x40014000, size: 0x400}
  - {name: TIM10, model: stm32.tim, base: 0x40014400, size: 0x400}
  - {name: TIM11, model: stm32.tim, base: 0x40014800, size: 0x400}
  # AHB1
  - {name: GPIOA, model: stm32.gpio, base: 0x40020000, size: 0x400, params: {port: A}}
  - {name: GPIOB, model: stm32.gpio, base: 0x40020400, size: 0x400, params: {port: B}}
  - {name: GPIOC, model: stm32.gpio, base: 0x40020800, size: 0x400, params: {port: C}}
  - {name: GPIOD, model: stm32.gpio, base: 0x40020C00, size: 0x400, params: {port: D}}
  - {name: GPIOE, model: stm32.gpio, base: 0x40021000, size: 0x400, params: {port: E}}
  - {name: GPIOF, model: stm32.gpio, base: 0x40021400, size: 0x400, params: {port: F}}
  - {name: GPIOG, model: stm32.gpio, base: 0x40021800, size: 0x400, params: {port: G}}
  - {name: GPIOH, model: stm32.gpio, base: 0x40021C00, size: 0x400, params: {port: H}}
  - {name: GPIOI, model: stm32.gpio, base: 0x40022000, size: 0x400, params: {port: I}}
  - {name: CRC, model: stm32.crc, base: 0x40023000, size: 0x400}
  - {name: RCC, model: stm32.rcc, base: 0x40023800, size: 0x400, params: {ext_hz: 8000000}}
  - {name: FLASH, model: stm32.flash, base: 0x40023C00, size: 0x400}   # flash interface registers
  - {name: DMA1, model: stm32.dma, base: 0x40026000, size: 0x400, params: {controller: 1}}   # no memory-to-memory (RM0090 10.3.6)
  - {name: DMA2, model: stm32.dma, base: 0x40026400, size: 0x400, params: {controller: 2}}
  - {name: Ethernet_MAC, model: stub, base: 0x40028000, size: 0x1400}   # ETH MAC/MMC/PTP/DMA: STM32F407 only (not on F405 silicon)
  - {name: OTG_HS_GLOBAL, model: stub, base: 0x40040000, size: 0x40000}   # USB OTG HS (whole 256 KB window)
  # AHB2
  - {name: OTG_FS_GLOBAL, model: stub, base: 0x50000000, size: 0x40000}   # USB OTG FS (whole 256 KB window)
  - {name: DCMI, model: stub, base: 0x50050000, size: 0x400}   # STM32F407 only
  - {name: CRYP, model: stub, base: 0x50060000, size: 0x400}   # STM32F415/417 only
  - {name: HASH, model: stub, base: 0x50060400, size: 0x400}   # STM32F415/417 only
  - {name: RNG, model: stm32.rng, base: 0x50060800, size: 0x400}
  # AHB3
  - {name: FSMC, model: stub, base: 0xA0000000, size: 0x1000}   # FSMC control registers
  # Cortex-M4 debug MCU
  - {name: DBGMCU, model: stm32.dbgmcu, base: 0xE0042000, size: 0x400}

