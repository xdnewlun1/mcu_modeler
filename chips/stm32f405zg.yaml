# STMicroelectronics STM32F405ZG (Cortex-M4F, 168 MHz, 1 MB flash, 192 KB RAM incl. 64 KB CCM, 144-pin LQFP).
# Sources: DS8626 Rev 12 (STM32F405xx/STM32F407xx data sheet) Table 7 (pin definitions, LQFP144 column), Figure 14
# (LQFP144 pinout), Table 9 (alternate function mapping AF0..AF15) and Table 10 (register boundary addresses);
# CMSIS-SVD STM32F405.svd (cmsis-svd-data @ c65f8551, see chips/README.md) for bases and IRQ numbers.
# Pin table: transcribed from the data sheet text and cross-checked against Figure 14 and ST's STM32_open_pin_data
# (STM32F405ZGTx.xml + GPIO-STM32F417_gpio_v1_0_Modes.xml @ 7d1f1514) - 0 differences in pin numbers / AF numbers.
# The data sheet covers F405 and F407: Ethernet (ETH_*) and camera (DCMI_*) alternate functions exist only on the
# STM32F407 and are omitted from `functions`. Data sheet typo fixed: PG13 AF8 is USART6_CTS ("UART6_CTS" in DS8626).
# functions keys: AF0..AF15 (GPIOx_AFRL/AFRH value), ADC (ADC channel, used as owner in analog mode), analog (other
# analog functions: DAC_OUTx, OSC_IN/OUT, OSC32_IN/OUT), additional (digital additional functions: WKUP, RTC_*, VBUS).
name: STM32F405ZG
package: LQFP144
family: stm32
regs_file: stm32f405_regs.yaml
gpio_name_format: "P{port}{bit}"
# 16 MHz = HSI after reset; the stm32.rcc model derives HCLK from the PLL/prescaler registers and retunes the clock.
core: {arch: armv7e-m, backend: unicorn, cpu: cortex-m4, fpu: true, clock_hz: 16000000, addr_unit_bits: 8, num_irqs: 82}
# SysTick CLKSOURCE=0 reference: HCLK/8 (RM0090 Figure 21 "Cortex System timer"): core cycles per count.
systick_ext_div: 8
# Boot from main flash (BOOT0 = 0): the CPU fetches the vector table through the alias at 0x00000000. CHIP_EM has no
# memory aliasing, so the alias is not mapped; instead VTOR starts at the flash base (images are linked at 0x08000000).
vtor: 0x08000000

memory:
  - {name: FLASH, base: 0x08000000, size: 0x100000, kind: flash}
  - {name: CCMRAM, base: 0x10000000, size: 0x10000, kind: ram}
  - {name: SRAM, base: 0x20000000, size: 0x20000, kind: ram}       # SRAM1 112 KB + SRAM2 16 KB
  - {name: BKPSRAM, base: 0x40024000, size: 0x1000, kind: ram}     # backup SRAM (AHB1)
  # system memory (0x1FFF0000, bootloader), OTP (0x1FFF7800) and option bytes (0x1FFFC000) are not mapped

# armv7m.scs (0xE000E000, SysTick/NVIC/SCB) is created by the arch layer, not listed here.
peripherals:
  # APB1
  - {name: TIM2, model: stm32.tim, base: 0x40000000, size: 0x400}
  - {name: TIM3, model: stm32.tim, base: 0x40000400, size: 0x400}
  - {name: TIM4, model: stm32.tim, base: 0x40000800, size: 0x400}
  - {name: TIM5, model: stm32.tim, base: 0x40000C00, size: 0x400}
  - {name: TIM6, model: stm32.tim, base: 0x40001000, size: 0x400}
  - {name: TIM7, model: stm32.tim, base: 0x40001400, size: 0x400}
  - {name: TIM12, model: stm32.tim, base: 0x40001800, size: 0x400}
  - {name: TIM13, model: stm32.tim, base: 0x40001C00, size: 0x400}
  - {name: TIM14, model: stm32.tim, base: 0x40002000, size: 0x400}
  - {name: RTC, model: stm32.rtc, base: 0x40002800, size: 0x400}   # RTC and backup registers (backup domain)
  - {name: WWDG, model: stm32.wwdg, base: 0x40002C00, size: 0x400}
  - {name: IWDG, model: stm32.iwdg, base: 0x40003000, size: 0x400}
  - {name: I2S2ext, model: stub, base: 0x40003400, size: 0x400}
  - {name: SPI2, model: stm32.spi, base: 0x40003800, size: 0x400}   # SPI2/I2S2 (I2S mode not modelled)
  - {name: SPI3, model: stm32.spi, base: 0x40003C00, size: 0x400}   # SPI3/I2S3 (I2S mode not modelled)
  - {name: I2S3ext, model: stub, base: 0x40004000, size: 0x400}
  - {name: USART2, model: stm32.usart, base: 0x40004400, size: 0x400, params: {index: 2, kind: usart}}
  - {name: USART3, model: stm32.usart, base: 0x40004800, size: 0x400, params: {index: 3, kind: usart}}
  - {name: UART4, model: stm32.usart, base: 0x40004C00, size: 0x400, params: {index: 4, kind: uart}}
  - {name: UART5, model: stm32.usart, base: 0x40005000, size: 0x400, params: {index: 5, kind: uart}}
  - {name: I2C1, model: stm32.i2c, base: 0x40005400, size: 0x400}
  - {name: I2C2, model: stm32.i2c, base: 0x40005800, size: 0x400}
  - {name: I2C3, model: stm32.i2c, base: 0x40005C00, size: 0x400}
