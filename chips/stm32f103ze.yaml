# default / remap classification; svd/dl-open-pin-data-f1/) and checked against the RM0008 9.3 remap tables (Tables 34,
# 43-46, 52-56); see chips/README.md "STM32F103 medium / high density".
name: STM32F103ZE
package: LQFP144
family: stm32f1
regs_file: stm32f103_regs.yaml
gpio_name_format: "P{port}{bit}"
# 8 MHz = HSI after reset; stm32f1.rcc derives HCLK from CFGR/PLL and retunes the clock (72 MHz max with HSE x 9).
core: {arch: armv7-m, backend: unicorn, cpu: cortex-m3, fpu: false, clock_hz: 8000000, addr_unit_bits: 8, num_irqs: 60}
# SysTick CLKSOURCE=0 reference: HCLK/8 (RM0008 Figure 8 clock tree "to Cortex System timer /8").
