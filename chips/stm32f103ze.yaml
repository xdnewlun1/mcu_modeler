# High-density performance line, DEV_ID 0x414 (RM0008 31.6.1).  Base file of the high-density F103 parts: the
# package variants (stm32f103{rc,re,vc,ve,zc}.yaml) include it and override name, package, memory, pins.
# Memory map, register boundary addresses and IRQs: RM0008 Rev 21 3.3 (Table 3), 10.1.2 Table 63 (60 vectors);
# CMSIS-SVD STM32F103xx.svd (cmsis-svd-data @ c65f8551, chips/stm32f103_regs.yaml) for bases and register layouts.
# Adds to medium density: TIM5-8, SPI3 (SPI2/SPI3 with I2S), UART4/5, DAC, GPIOF/G, ADC3, SDIO, DMA2, FSMC,
# BKP DR11-DR42 (RM0008 6.4.5, Table 17), 2 KB flash pages.

