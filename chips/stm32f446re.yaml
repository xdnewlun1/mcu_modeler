# STMicroelectronics STM32F446RE (Cortex-M4F, 180 MHz with over-drive, 512 KB flash (sectors 0-7), 128 KB SRAM =
# SRAM1 112 KB + SRAM2 16 KB, no CCM RAM, LQFP64; the NUCLEO-F446RE part). Base file of the STM32F446xx die (DEV_ID 0x421):
# chips/stm32f446{ve,ze,me}.yaml include it and override name, package and pins.
# Sources (see docs/LIMITATIONS.md "STM32F446"; the data sheet DS10693 is still not in the repo):
# * RM0390 Rev 9 (docs/datasheets/st/RM0390_stm32f446_reference_manual.pdf): memory map Table 1, vector table Table 38
#   (10.2, every entry below checked), DMA Tables 28/29, RCC/PWR/FLASH/SYSCFG/EXTI registers, QUADSPI, FMPI2C, CEC,
#   SPDIFRX, device electronic signature (ch. 34), DBGMCU IDCODE (33.6.1);
# * CMSIS-SVD STM32F446.svd (cmsis-svd-data @ c65f8551, SVD version 1.1; chips/README.md) for peripheral bases and the
#   register table chips/stm32f446_regs.yaml;
# * the STM32CubeF4 device header stm32f446xx.h (firmware/vendor/STM32CubeF4) for the IRQ numbers (IRQn_Type), the
#   FMPI2C1 base (the SVD has no FMPI2C1) and the reset values that HAL_RCC_DeInit writes;
# * ST's STM32_open_pin_data @ 7d1f1514 (svd/dl-open-pin-data-f446/) for the pin table;
# * RM0090 Rev 22 for the models of the IP shared with the STM32F42x (DMA, TIM, USART, SPI/I2S, I2C, bxCAN, SAI, FMC,
#   OTG, SDIO, DCMI, ADC, DAC, RTC); their F446 differences were checked against RM0390 (docs/LIMITATIONS.md).
# Part-number decoding (STM32 ordering scheme): R = 64 pins, V = 100, Z = 144, M = 81 (WLCSP); C = 256 KB, E = 512 KB;
# T = LQFP, Y = WLCSP.
name: STM32F446RE
package: LQFP64
family: stm32
regs_file: stm32f446_regs.yaml
gpio_name_format: "P{port}{bit}"
# 16 MHz = HSI after reset; stm32.rcc_f446 derives HCLK from the PLL/prescaler registers (PLL_P or PLL_R as SYSCLK).
# num_irqs 97: highest vector is 96 FMPI2C1_ER (stm32f446xx.h IRQn_Type).
core: {arch: armv7e-m, backend: unicorn, cpu: cortex-m4, fpu: true, clock_hz: 16000000, addr_unit_bits: 8, num_irqs: 97}
# SysTick CLKSOURCE=0 reference: HCLK/8 (RM0390 6.2 clock tree, "Cortex system timer").
systick_ext_div: 8
# Boot from main flash (BOOT0 = 0) through the alias at 0x00000000, which CHIP_EM does not map: VTOR starts at the
# flash base (images are linked at 0x08000000).
vtor: 0x08000000

memory:
  - {name: FLASH, base: 0x08000000, size: 0x80000, kind: flash}    # 512 KB: sectors 0-3 16 KB, 4 64 KB, 5-7 128 KB
  - {name: SRAM, base: 0x20000000, size: 0x20000, kind: ram}       # SRAM1 112 KB + SRAM2 16 KB
  - {name: BKPSRAM, base: 0x40024000, size: 0x1000, kind: ram}     # backup SRAM (AHB1)
  # system memory (0x1FFF0000), OTP (0x1FFF7800) and option bytes (0x1FFFC000) are not mapped

# armv7m.scs (0xE000E000, SysTick/NVIC/SCB) is created by the arch layer, not listed here.
# The STM32F446 has no I2S2ext/I2S3ext (SPI2/SPI3 are half-duplex I2S), no Ethernet, RNG, CRYP/HASH, LTDC, DMA2D,
# UART7/8, SPI5/6, GPIOI-K or CCM RAM.
peripherals:
  # APB1
  - {name: TIM2, model: stm32.tim, base: 0x40000000, size: 0x400}
  - {name: TIM3, model: stm32.tim, base: 0x40000400, size: 0x400}
  - {name: TIM4, model: stm32.tim, base: 0x40000800, size: 0x400}
  - {name: TIM5, model: stm32.tim, base: 0x40000C00, size: 0x400}
  - {name: TIM6, model: stm32.tim, base: 0x40001000, size: 0x400}
  - {name: TIM7, model: stm32.tim, base: 0x40001400, size: 0x400}
  - {name: TIM12, model: stm32.tim, base: 0x40001800, size: 0x400}
  - {name: TIM13, model: stm32.tim, base: 0x40001C00, size: 0x400}
  - {name: TIM14, model: stm32.tim, base: 0x40002000, size: 0x400}
  - {name: RTC, model: stm32.rtc, base: 0x40002800, size: 0x400}   # RTC and backup registers (backup domain)
  - {name: WWDG, model: stm32.wwdg, base: 0x40002C00, size: 0x400}
  - {name: IWDG, model: stm32.iwdg, base: 0x40003000, size: 0x400}
  - {name: SPI2, model: stm32.spi, base: 0x40003800, size: 0x400}   # SPI2/I2S2
  - {name: SPI3, model: stm32.spi, base: 0x40003C00, size: 0x400}   # SPI3/I2S3
  - {name: SPDIFRX, model: stm32.spdifrx, base: 0x40004000, size: 0x400}   # SPDIF receiver (RM0390 ch. 27; input from a board spdif_source part, INSEL n = SPDIFRX_INn)
  - {name: USART2, model: stm32.usart, base: 0x40004400, size: 0x400, params: {index: 2, kind: usart}}
  - {name: USART3, model: stm32.usart, base: 0x40004800, size: 0x400, params: {index: 3, kind: usart}}
  - {name: UART4, model: stm32.usart, base: 0x40004C00, size: 0x400, params: {index: 4, kind: uart}}
  - {name: UART5, model: stm32.usart, base: 0x40005000, size: 0x400, params: {index: 5, kind: uart}}
  - {name: I2C1, model: stm32.i2c, base: 0x40005400, size: 0x400}   # with FLTR (digital noise filter)
  - {name: I2C2, model: stm32.i2c, base: 0x40005800, size: 0x400}
  - {name: I2C3, model: stm32.i2c, base: 0x40005C00, size: 0x400}
  - {name: FMPI2C1, model: stm32.fmpi2c, base: 0x40006000, size: 0x400}   # Fast-mode Plus I2C (RM0390 ch. 23; not in the SVD): controller + target on the pins, DMA
  - {name: CAN1, model: stm32.can, base: 0x40006400, size: 0x400}            # bxCAN master: owns the 28 filter banks
  - {name: CAN2, model: stm32.can, base: 0x40006800, size: 0x400}            # bxCAN slave: needs the CAN1 clock
  - {name: CEC, model: stm32.cec, base: 0x40006C00, size: 0x400}             # HDMI-CEC (RM0390 ch. 32): bit-level on the CEC pin (open drain)
  - {name: PWR, model: stm32.pwr_f446, base: 0x40007000, size: 0x400}        # over-drive / under-drive (RM0090 5.5 IP)
  - {name: DAC, model: stm32.dac, base: 0x40007400, size: 0x400}
  # APB2
  - {name: TIM1, model: stm32.tim, base: 0x40010000, size: 0x400}
  - {name: TIM8, model: stm32.tim, base: 0x40010400, size: 0x400}
  - {name: USART1, model: stm32.usart, base: 0x40011000, size: 0x400, params: {index: 1, kind: usart}}
  - {name: USART6, model: stm32.usart, base: 0x40011400, size: 0x400, params: {index: 6, kind: usart}}
  - {name: ADC1, model: stm32.adc, base: 0x40012000, size: 0x100}
  - {name: ADC2, model: stm32.adc, base: 0x40012100, size: 0x100}
  - {name: ADC3, model: stm32.adc, base: 0x40012200, size: 0x100}
  - {name: C_ADC, model: stm32.adc_common, base: 0x40012300, size: 0x400}   # ADC common registers
  - {name: SDIO, model: stm32.sdio, base: 0x40012C00, size: 0x400, params: {ceata: false}}   # RM0390 ch. 29: the F405 SDIO IP without CE-ATA / STBITERR ("SDMMC" v2 in the SVD is wrong); clock DCKCFGR2.SDIOSEL
  - {name: SPI1, model: stm32.spi, base: 0x40013000, size: 0x400}   # SPI1/I2S1
  - {name: SPI4, model: stm32.spi, base: 0x40013400, size: 0x400}
  - {name: SYSCFG, model: stm32.syscfg_f446, base: 0x40013800, size: 0x400}   # RM0390 8.2: + CFGR (FMPI2C1 Fm+ drive)
  - {name: EXTI, model: stm32.exti, base: 0x40013C00, size: 0x400, params: {reserved_edge_lines: [19]}}   # RM0390 10.3.3/10.3.4: no line 19 edge bits
  - {name: TIM9, model: stm32.tim, base: 0x40014000, size: 0x400}
  - {name: TIM10, model: stm32.tim, base: 0x40014400, size: 0x400}
  - {name: TIM11, model: stm32.tim, base: 0x40014800, size: 0x400}
  - {name: SAI1, model: stm32.sai, base: 0x40015800, size: 0x400, params: {gate: SAI1}}   # kernel clock DCKCFGR.SAI1SRC
  - {name: SAI2, model: stm32.sai, base: 0x40015C00, size: 0x400, params: {gate: SAI2}}   # kernel clock DCKCFGR.SAI2SRC
  # AHB1
  - {name: GPIOA, model: stm32.gpio, base: 0x40020000, size: 0x400, params: {port: A}}
  - {name: GPIOB, model: stm32.gpio, base: 0x40020400, size: 0x400, params: {port: B}}
  - {name: GPIOC, model: stm32.gpio, base: 0x40020800, size: 0x400, params: {port: C}}
  - {name: GPIOD, model: stm32.gpio, base: 0x40020C00, size: 0x400, params: {port: D}}
  - {name: GPIOE, model: stm32.gpio, base: 0x40021000, size: 0x400, params: {port: E}}
  - {name: GPIOF, model: stm32.gpio, base: 0x40021400, size: 0x400, params: {port: F}}
  - {name: GPIOG, model: stm32.gpio, base: 0x40021800, size: 0x400, params: {port: G}}
  - {name: GPIOH, model: stm32.gpio, base: 0x40021C00, size: 0x400, params: {port: H}}
  - {name: CRC, model: stm32.crc, base: 0x40023000, size: 0x400}
  - {name: RCC, model: stm32.rcc_f446, base: 0x40023800, size: 0x400, params: {ext_hz: 8000000}}   # PLL_R, PLLSAI/PLLI2S with M/P, DCKCFGR2
  - {name: FLASH, model: stm32.flash_f446, base: 0x40023C00, size: 0x400}   # single bank, sectors 0-7
  - {name: DMA1, model: stm32.dma, base: 0x40026000, size: 0x400, params: {controller: 1, requests: f446}}
  - {name: DMA2, model: stm32.dma, base: 0x40026400, size: 0x400, params: {controller: 2, requests: f446}}
  - {name: OTG_HS, model: stm32.otg_hs, base: 0x40040000, size: 0x40000, params: {core: otg2, endpoints: 9, channels: 16}}   # USB OTG HS core (RM0390 31.3 Table 221: 9 endpoints, 16 channels, 4 KB, LPM; embedded FS PHY only)
  # AHB2
  - {name: OTG_FS, model: stm32.otg_fs, base: 0x50000000, size: 0x40000, params: {core: otg2, endpoints: 6, channels: 12}}   # USB OTG FS core (RM0390 31.3 Table 221: 6 endpoints, 12 channels, 1.25 KB, LPM)
  - {name: DCMI, model: stm32.dcmi, base: 0x50050000, size: 0x400}
  # AHB3
  - {name: FMC, model: stm32.fmc_f446, base: 0xA0000000, size: 0x1000}   # FMC control registers (RM0390 ch. 11: NAND bank 3 only); NOR/PSRAM 0x60000000, SDRAM 0xC0000000/0xD0000000
  - {name: QUADSPI, model: stm32.quadspi, base: 0xA0001000, size: 0x400}   # QUADSPI registers; memory-mapped window 0x90000000 (256 MB)
  # OTP area 0x1FFF7800-0x1FFF7A0F (erased) and the device electronic signature (RM0390 ch. 34): unique ID 0x1FFF7A10,
  # F_SIZE 0x1FFF7A22 (flash KB from `memory`), package data 0x1FFF7BF0 (PKG from `package`)
  - {name: SYSMEM, model: stm32.sysmem_f446, base: 0x1FFF7800, size: 0x400}
  # Cortex-M4 debug MCU
  - {name: DBGMCU, model: stm32.dbgmcu, base: 0xE0042000, size: 0x400, params: {idcode: 0x10006421}}   # DEV_ID 0x421, REV_ID 0x1000 = rev A / 1 (RM0390 33.6.1)

# External interrupt numbers (exception = 16 + n), stm32f446xx.h IRQn_Type, checked entry by entry against RM0390 10.2
# Table 38 (positions 0-96; 61/62, 79/80, 82/83, 85/86, 88-90 are reserved). STM32F446.svd attaches several
# <interrupt> elements to the wrong peripherals and lists vectors this part does not have (UART7/8, ETH, LCD-TFT);
# the numbers below follow the device header, which svd2chip --check confirms where the SVD agrees.
irqs:
  0: WWDG
  1: PVD
  2: TAMP_STAMP
  3: RTC_WKUP
  4: FLASH
  5: RCC
  6: EXTI0
  7: EXTI1
  8: EXTI2
  9: EXTI3
  10: EXTI4
  11: DMA1_Stream0
  12: DMA1_Stream1
