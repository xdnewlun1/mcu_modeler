# Pin table: generated from ST's STM32_open_pin_data @ 7d1f1514ed5583ec5007ad91236b4e1d377295b1 (cached in
# svd/dl-open-pin-data-f446/): mcu/STM32F446R(C-E)Tx.xml gives the LQFP64 positions and the signals of each pin,
# mcu/IP/GPIO-STM32F446_gpio_v1_0_Modes.xml the AF number of every alternate function. The data sheet (DS10693) is not
# in the repo, so the names follow ST's open pin data with the DS8626/DS9405 spelling conventions of the other STM32F4
# files: USB_OTG_FS_* / USB_OTG_HS_* -> OTG_FS_* / OTG_HS_*, SYS_JTMS-SWDIO -> JTMS-SWDIO (etc.), RCC_MCO_1 -> MCO1,
# SPIx and I2Sx signals on the same AF joined as SPIx_SCK/I2Sx_CK; ADCn_INm -> ADC123_INm; RCC_OSC_IN -> analog OSC_IN;
# SYS_WKUPn -> additional WKUPn (ST numbers the two wake-up pins WKUP0 = PA0 and WKUP1 = PC13); FMC_CLE / FMC_ALE
# (no own AF in the modes file) share AF12 with FMC_A16 / FMC_A17. ST's pseudo-signals ADCx_EXTIy / DAC_EXTIy (EXTI
# lines as converter triggers) are not pin functions and are left out. EVENTOUT (AF15) on every GPIO.
# Second source: the GPIO_AFn_<periph> defines for STM32F446xx in stm32f4xx_hal_gpio_ex.h (every AF/peripheral pair of
# the table exists there; tests/test_stm32f446_pins.py).
# All 64 package pins (50 GPIOs, IONb in the open pin data).
pins:
  - {num: 1, name: VBAT, kind: power, default: VBAT}
  - {num: 2, name: PC13, kind: gpio, port: C, bit: 13, default: GPIO, functions: {AF15: EVENTOUT, additional: RTC_AF1/WKUP1}}
  - {num: 3, name: PC14/OSC32_IN, kind: gpio, port: C, bit: 14, default: GPIO, functions: {AF15: EVENTOUT, analog: OSC32_IN}}
  - {num: 4, name: PC15/OSC32_OUT, kind: gpio, port: C, bit: 15, default: GPIO, functions: {AF15: EVENTOUT, analog: OSC32_OUT}}
  - {num: 5, name: PH0/OSC_IN, kind: gpio, port: H, bit: 0, default: GPIO, functions: {AF15: EVENTOUT, analog: OSC_IN}}
  - {num: 6, name: PH1/OSC_OUT, kind: gpio, port: H, bit: 1, default: GPIO, functions: {AF15: EVENTOUT, analog: OSC_OUT}}
  - {num: 7, name: NRST, kind: special, default: NRST}
  - {num: 8, name: PC0, kind: gpio, port: C, bit: 0, default: GPIO, functions: {AF6: SAI1_MCLK_B, AF10: OTG_HS_ULPI_STP, AF15: EVENTOUT, ADC: ADC123_IN10}}
  - {num: 9, name: PC1, kind: gpio, port: C, bit: 1, default: GPIO, functions: {AF5: SPI3_MOSI/I2S3_SD, AF6: SAI1_SD_A, AF7: SPI2_MOSI/I2S2_SD, AF15: EVENTOUT, ADC: ADC123_IN11}}
  - {num: 10, name: PC2, kind: gpio, port: C, bit: 2, default: GPIO, functions: {AF5: SPI2_MISO, AF10: OTG_HS_ULPI_DIR, AF15: EVENTOUT, ADC: ADC123_IN12}}
  - {num: 11, name: PC3, kind: gpio, port: C, bit: 3, default: GPIO, functions: {AF5: SPI2_MOSI/I2S2_SD, AF10: OTG_HS_ULPI_NXT, AF15: EVENTOUT, ADC: ADC123_IN13}}
  - {num: 12, name: VSSA, kind: power, default: VSSA}
  - {num: 13, name: VDDA, kind: power, default: VDDA}
  - {num: 14, name: PA0/WKUP, kind: gpio, port: A, bit: 0, default: GPIO, functions: {AF1: TIM2_CH1/TIM2_ETR, AF2: TIM5_CH1, AF3: TIM8_ETR, AF7: USART2_CTS, AF8: UART4_TX, AF15: EVENTOUT, ADC: ADC123_IN0, additional: RTC_AF2/WKUP0}}
  - {num: 15, name: PA1, kind: gpio, port: A, bit: 1, default: GPIO, functions: {AF1: TIM2_CH2, AF2: TIM5_CH2, AF7: USART2_RTS, AF8: UART4_RX, AF9: QUADSPI_BK1_IO3, AF15: EVENTOUT, ADC: ADC123_IN1}}
  - {num: 16, name: PA2, kind: gpio, port: A, bit: 2, default: GPIO, functions: {AF1: TIM2_CH3, AF2: TIM5_CH3, AF3: TIM9_CH1, AF7: USART2_TX, AF15: EVENTOUT, ADC: ADC123_IN2}}
  - {num: 17, name: PA3, kind: gpio, port: A, bit: 3, default: GPIO, functions: {AF1: TIM2_CH4, AF2: TIM5_CH4, AF3: TIM9_CH2, AF6: SAI1_FS_A, AF7: USART2_RX, AF10: OTG_HS_ULPI_D0, AF15: EVENTOUT, ADC: ADC123_IN3}}
  - {num: 18, name: VSS, kind: power, default: VSS}
  - {num: 19, name: VDD, kind: power, default: VDD}
  - {num: 20, name: PA4, kind: gpio, port: A, bit: 4, default: GPIO, functions: {AF5: SPI1_NSS/I2S1_WS, AF6: SPI3_NSS/I2S3_WS, AF7: USART2_CK, AF12: OTG_HS_SOF, AF13: DCMI_HSYNC, AF15: EVENTOUT, ADC: ADC12_IN4, analog: DAC_OUT1}}
  - {num: 21, name: PA5, kind: gpio, port: A, bit: 5, default: GPIO, functions: {AF1: TIM2_CH1/TIM2_ETR, AF3: TIM8_CH1N, AF5: SPI1_SCK/I2S1_CK, AF10: OTG_HS_ULPI_CK, AF15: EVENTOUT, ADC: ADC12_IN5, analog: DAC_OUT2}}
  - {num: 22, name: PA6, kind: gpio, port: A, bit: 6, default: GPIO, functions: {AF1: TIM1_BKIN, AF2: TIM3_CH1, AF3: TIM8_BKIN, AF5: SPI1_MISO, AF6: I2S2_MCK, AF9: TIM13_CH1, AF13: DCMI_PIXCLK, AF15: EVENTOUT, ADC: ADC12_IN6}}
  - {num: 23, name: PA7, kind: gpio, port: A, bit: 7, default: GPIO, functions: {AF1: TIM1_CH1N, AF2: TIM3_CH2, AF3: TIM8_CH1N, AF5: SPI1_MOSI/I2S1_SD, AF9: TIM14_CH1, AF15: EVENTOUT, ADC: ADC12_IN7}}
  - {num: 24, name: PC4, kind: gpio, port: C, bit: 4, default: GPIO, functions: {AF5: I2S1_MCK, AF8: SPDIFRX_IN2, AF15: EVENTOUT, ADC: ADC12_IN14}}
  - {num: 25, name: PC5, kind: gpio, port: C, bit: 5, default: GPIO, functions: {AF7: USART3_RX, AF8: SPDIFRX_IN3, AF15: EVENTOUT, ADC: ADC12_IN15}}
  - {num: 26, name: PB0, kind: gpio, port: B, bit: 0, default: GPIO, functions: {AF1: TIM1_CH2N, AF2: TIM3_CH3, AF3: TIM8_CH2N, AF7: SPI3_MOSI/I2S3_SD, AF8: UART4_CTS, AF10: OTG_HS_ULPI_D1, AF12: SDIO_D1, AF15: EVENTOUT, ADC: ADC12_IN8}}
  - {num: 27, name: PB1, kind: gpio, port: B, bit: 1, default: GPIO, functions: {AF1: TIM1_CH3N, AF2: TIM3_CH4, AF3: TIM8_CH3N, AF10: OTG_HS_ULPI_D2, AF12: SDIO_D2, AF15: EVENTOUT, ADC: ADC12_IN9}}
  - {num: 28, name: PB2, kind: gpio, port: B, bit: 2, default: GPIO, functions: {AF1: TIM2_CH4, AF6: SAI1_SD_A, AF7: SPI3_MOSI/I2S3_SD, AF9: QUADSPI_CLK, AF10: OTG_HS_ULPI_D4, AF12: SDIO_CK, AF15: EVENTOUT}}
  - {num: 29, name: PB10, kind: gpio, port: B, bit: 10, default: GPIO, functions: {AF1: TIM2_CH3, AF4: I2C2_SCL, AF5: SPI2_SCK/I2S2_CK, AF6: SAI1_SCK_A, AF7: USART3_TX, AF10: OTG_HS_ULPI_D3, AF15: EVENTOUT}}
  - {num: 30, name: VCAP_1, kind: power, default: VCAP_1}
  - {num: 31, name: VSS, kind: power, default: VSS}
