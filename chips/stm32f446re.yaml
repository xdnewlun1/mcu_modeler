  58: DMA2_Stream2
  59: DMA2_Stream3
  60: DMA2_Stream4
  63: CAN2_TX
  64: CAN2_RX0
  65: CAN2_RX1
  66: CAN2_SCE
  67: OTG_FS
  68: DMA2_Stream5
  69: DMA2_Stream6
  70: DMA2_Stream7
  71: USART6
  72: I2C3_EV
  73: I2C3_ER
  74: OTG_HS_EP1_OUT
  75: OTG_HS_EP1_IN
