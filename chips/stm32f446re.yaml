  14: DMA1_Stream3
  15: DMA1_Stream4
  16: DMA1_Stream5
  17: DMA1_Stream6
  18: ADC
  19: CAN1_TX
  20: CAN1_RX0
  21: CAN1_RX1
  22: CAN1_SCE
  23: EXTI9_5
  24: TIM1_BRK_TIM9
  25: TIM1_UP_TIM10
  26: TIM1_TRG_COM_TIM11
  27: TIM1_CC
  28: TIM2
  29: TIM3
  30: TIM4
  31: I2C1_EV
  32: I2C1_ER
  33: I2C2_EV
  34: I2C2_ER
  35: SPI1
