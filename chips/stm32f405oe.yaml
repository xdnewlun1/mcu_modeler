# STMicroelectronics STM32F405OE (STM32F405, Cortex-M4F, 168 MHz, 512 KB flash, 192 KB RAM incl. 64 KB CCM, WLCSP90).
# Generated from DS8626 Rev 12 (STM32F405xx/STM32F407xx data sheet): Table 2 (memory/peripheral counts), Table 7
# (WLCSP90 column), Table 9 (AF0..AF15), Figure 17 (WLCSP90 ballout, bump view). Cross-checked against ST's STM32_open_pin_data @ 7d1f1514
# (mcu/STM32F405O(E-G)Yx.xml, 90 pins: 0 differences in positions) and mcu/IP/GPIO-STM32F417_gpio_v1_0_Modes.xml
# (0 differences in AF numbers). For pins shared with the LQFP144 part, names and functions equal
# chips/stm32f405zg.yaml. Ethernet (ETH_*) and camera (DCMI_*) alternate functions exist only on the STM32F407 and are omitted.
# Data sheet typo fixed: PG13 AF8 is USART6_CTS ("UART6_CTS" in DS8626).
# Ball numbering: `num` = row-major index over the 90 bumps (rows A..J without I, columns 1..10; A1 = 1,
# J10 = 90), `ball` = the bump name.
# Same die (DEV_ID 0x413), memory map, peripherals and IRQs as the STM32F405ZG, which is included below; this file
# overrides name, package, memory and pins. Registers: STM32F405.svd (svd2chip --check also 0 mismatches against
# cmsis-svd-data STM32F407.svd).
include: stm32f405zg.yaml
name: STM32F405OE
package: WLCSP90
regs_file: stm32f405_regs.yaml
memory:
  - {name: FLASH, base: 0x08000000, size: 0x80000, kind: flash}   # 512 KB
  - {name: CCMRAM, base: 0x10000000, size: 0x10000, kind: ram}
  - {name: SRAM, base: 0x20000000, size: 0x20000, kind: ram}       # SRAM1 112 KB + SRAM2 16 KB
  - {name: BKPSRAM, base: 0x40024000, size: 0x1000, kind: ram}     # backup SRAM (AHB1)

# All 90 package pins (72 GPIOs, DS8626 Table 2).
pins:
  - {num: 1, ball: A1, name: VDD, kind: power, default: VDD}
  - {num: 2, ball: A2, name: PA14, kind: gpio, port: A, bit: 14, default: JTCK-SWCLK, functions: {AF0: JTCK-SWCLK, AF15: EVENTOUT}}
