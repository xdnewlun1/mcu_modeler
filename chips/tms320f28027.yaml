  - {num: 31, name: "GPIO32/SDAA/EPWMSYNCI/ADCSOCAO", kind: gpio, port: B, bit: 0, default: GPIO, functions: {GPIO: "GPIO32", MUX1: "SDAA", MUX2: "EPWMSYNCI", MUX3: "ADCSOCAO"}}
  - {num: 32, name: "VDD", kind: power}
  - {num: 33, name: "VSS", kind: power}
  - {num: 34, name: "VREGENZ", kind: special}
  - {num: 35, name: "VDDIO", kind: power}
  - {num: 36, name: "GPIO33/SCLA/EPWMSYNCO/ADCSOCBO", kind: gpio, port: B, bit: 1, default: GPIO, functions: {GPIO: "GPIO33", MUX1: "SCLA", MUX2: "EPWMSYNCO", MUX3: "ADCSOCBO"}}
  - {num: 37, name: "GPIO2/EPWM2A", kind: gpio, port: A, bit: 2, default: GPIO, functions: {GPIO: "GPIO2", MUX1: "EPWM2A"}}
