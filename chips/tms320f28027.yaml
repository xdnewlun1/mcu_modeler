# TI TMS320F28027 (Piccolo A, F2802x: fixed-point C28x, no FPU, 60 MHz), 48-pin LQFP "PT" -- the LAUNCHXL-F28027 part.
# Sources: data sheet docs/datasheets/ti/tms320f28027.pdf = SPRS523P (Feb 2021): Table 6-1 (device comparison: F28027
# 32K-word flash, 6K-word SARAM = M0 1K + M1 1K + L0 4K, 1K OTP, 8K boot ROM, ePWM1-4 with HRPWM on 1A-4A, eCAP1, 13 ADC
# channels, COMP1/2, SPI-A, SCI-A, I2C-A, 22 GPIOs + 6 AIOs, 3 XINTs), Figure 9-1 (memory map), Table 9-3 (flash
# sectors), Tables 9-8..9-10 (peripheral frames), Table 9-11 (PARTID 0x00CF at 0x3D7FFF), Table 9-18 (PIE table),
# Table 9-1 (boot modes).  Behaviour: SPRUI09A (TMS320F2802x TRM, svd/c28x-docs/dl18), chips/README.md.
# Register table chips/tms320f2802x_regs.yaml (tools/gen_piccolo_regs.py; --check-ds: 379 data sheet addresses,
# 0 mismatches).  Pin table: SPRS523 Table 5-1 / Figure 5-1 / Tables 9-30..9-32, cross-checked against SPRUI09
# Table 1-5x (0 differences, chips/README.md "Piccolo").  Address units are 16-bit words.
# LAUNCHXL-F28027 (SPRUHH2C): LEDs on GPIO0-3 (through an inverting buffer), push button S3 on GPIO12, the XDS100 UART
# on SCI-A GPIO28 (RX) / GPIO29 (TX), boot switch S1 = GPIO34 / GPIO37 / TRST, no crystal fitted (INTOSC1).
name: TMS320F28027
package: LQFP48 (PT)
family: ti_c2000
regs_file: tms320f2802x_regs.yaml
gpio_name_format: "GPIO{num}"          # port A = GPIO0-31, port B = GPIO32-38
core: {arch: c28x, backend: c28x, cpu: c28x, fpu: false, clock_hz: 10000000, addr_unit_bits: 16, num_irqs: 0}

# Reset runs the boot ROM stand-in (chips/tms320f2802x_bootrom.asm) unless the image has an entry point (.c28img /
# TI .out: PC = entry, as if the boot ROM had branched to flash; SYSCTRL then applies the ROM's DIVSEL = 3 itself).
# InitBoot: CSM dummy read, Device_cal (0x3D7C80), DIVSEL = 3, boot pins GPIO37/GPIO34 (TRST = 0): 11 GetMode (flash
# 0x3F7FF6 unless OTP_KEY/OTP_BMODE say OTP), 10 wait, 01 SCI / 00 parallel (loaders not implemented: wait).
boot:
  entry: 0x3FF4B0                      # InitBoot (stand-in; the RESET vector at 0x3FFFC0 points here)
  sp: 0x0400
  rom_words:                           # tools/gen_piccolo_regs.py --bootrom-words chips/tms320f2802x_bootrom.asm
    0x3D7C80: [
      0x7622, 0x761F, 0x01C5, 0x2B00, 0x2B01, 0x761F, 0x01C0, 0x2B14, 0x2B16, 0x761A, 0x0006,
    ]
    0x3D7CC0: [
      0x8F3D, 0x7BFE, 0x9284, 0x1BA9, 0x55AA, 0x600A, 0x92C4, 0x5201, 0x6108, 0x5204, 0x6106, 0x5205,
      0x6104, 0x5206, 0x6102, 0x9A0B, 0x0006,
    ]
    0x3D7E80: [
      0xFF20, 0x170A, 0x0006, 0xFF20, 0x06D6, 0x0006,
    ]
    0x3FF4B0: [
      0x8D7F, 0x7FF8, 0x9281, 0x9281, 0x9281, 0x9281, 0x9281, 0x9281, 0x9281, 0x9281, 0x7622, 0x761F,
      0x01C0, 0x1A1C, 0x0008, 0x767D, 0x7C80, 0x7622, 0x761F, 0x01C0, 0x181C, 0xFFF7, 0x1A11, 0x0180,
      0x761F, 0x0034, 0x2800, 0x55AA, 0x761F, 0x01BF, 0x4508, 0x6C13, 0x4208, 0x6C0C, 0x761F, 0x0034,
      0x2801, 0x0003, 0x767D, 0x7CC0, 0x5206, 0x6114, 0x520B, 0x6115, 0x6F17, 0x761F, 0x0034, 0x2801,
      0x0002, 0x6F12, 0x4208, 0x6C06, 0x761F, 0x0034, 0x2801, 0x0001, 0x6F0B, 0x761F, 0x0034, 0x2B01,
      0x6F07, 0x76FD, 0x7800, 0x6F0B, 0x76FF, 0x7FF6, 0x6F08, 0x7622, 0x761F, 0x01C0, 0x2829, 0x0068,
      0x761A, 0x6F00, 0x0200, 0x8D00, 0x0000, 0x8D40, 0x0000, 0x8D80, 0x0000, 0x8DC0, 0x0000, 0x8F00,
      0x0000, 0x8F40, 0x0000, 0x7680, 0x0000, 0x761F, 0x0000, 0x761A, 0x7620, 0x7622, 0x761F, 0x01C0,
      0x2829, 0x0028, 0x761A, 0x6F00,
    ]
    0x3FFFC0: [
      0xF4B0, 0x003F, 0x0042, 0x0000, 0x0044, 0x0000, 0x0046, 0x0000, 0x0048, 0x0000, 0x004A, 0x0000,
      0x004C, 0x0000, 0x004E, 0x0000, 0x0050, 0x0000, 0x0052, 0x0000, 0x0054, 0x0000, 0x0056, 0x0000,
      0x0058, 0x0000, 0x005A, 0x0000, 0x005C, 0x0000, 0x005E, 0x0000, 0x0060, 0x0000, 0x0062, 0x0000,
      0x0064, 0x0000, 0xF50D, 0x003F, 0x0068, 0x0000, 0x006A, 0x0000, 0x006C, 0x0000, 0x006E, 0x0000,
      0x0070, 0x0000, 0x0072, 0x0000, 0x0074, 0x0000, 0x0076, 0x0000, 0x0078, 0x0000, 0x007A, 0x0000,
      0x007C, 0x0000, 0x007E, 0x0000,
    ]
auto_stub_ranges: [[0x0800, 0x0FFF], [0x1000, 0x5FFF], [0x6000, 0x7FFF]]   # unmodelled PF0-PF3 registers: RAM-like stubs

memory:
  - {name: M0, base: 0x000000, size: 0x0400, kind: ram}        # M0 SARAM (first 0x40 words: vectors with VMAP = 0)
  - {name: M1, base: 0x000400, size: 0x0400, kind: ram}        # M1 SARAM; SP = 0x0400 after reset
  - {name: L0, base: 0x008000, size: 0x1000, kind: ram}        # L0 SARAM 4K (secure), dual-mapped at 0x3F8000
  - {name: OTP, base: 0x3D7800, size: 0x07C0, kind: rom, fill: 0xFF}     # user OTP 1K (OTP_KEY/BMODE 0x3D7BFE/F) + TI
                                                     # calibration (Device_cal, Get_mode); 0x3D7FC0-0x3D7FFF: PARTID block
  - {name: FLASH, base: 0x3F0000, size: 0x8000, kind: flash, fill: 0xFF}  # sectors D,C,B,A (8K each, Table 9-3);
                                                                          # 0x3F7FF6 entry, 0x3F7FF8-0x3F7FFF password
  - {name: BOOTROM, base: 0x3FE000, size: 0x2000, kind: rom, fill: 0xFF}  # boot ROM 8K; CPU vectors at 0x3FFFC0

peripherals:
  - {name: L0HI, model: ti_c2000.alias, base: 0x3F8000, size: 0x1000, params: {target: 0x8000}}   # L0 program-space mirror
  - {name: PARTID, model: ti_c2000.partid, base: 0x3D7FC0, size: 0x40, params: {partid_offset: 0x3F, value: 0x00CF}}   # PARTID at 0x3D7FFF, SPRS523 Table 9-11: F28027PT
  # Peripheral Frame 0
  - {name: DEV_EMU, model: ti_c2000.storage, base: 0x0880, size: 0x105}   # DEVICECNF, CLASSID 0x00CF, REVID
  - {name: BORCFG, model: ti_c2000.storage, base: 0x0985, size: 0x3}
  - {name: FLASHREGS, model: ti_c2000.flash, base: 0x0A80, size: 0x60, params: {regs: FLASH}}
  - {name: CSM, model: ti_c2000.csm, base: 0x0AE0, size: 0x10,
     params: {pwl_base: 0x3F7FF8, secure_ranges: [[0x8000, 0x9000], [0x3D7800, 0x3D7C00], [0x3F0000, 0x3F8000],
                                                  [0x3F8000, 0x3F9000]]}}   # L0, user OTP, flash, L0 mirror
  - {name: ADCRESULT, model: ti_c2000.adc_soc_result, base: 0x0B00, size: 0x10}
  - {name: CPUTIMER0, model: ti_c2000.cputimer, base: 0x0C00, size: 0x8, params: {index: 0}}
  - {name: CPUTIMER1, model: ti_c2000.cputimer, base: 0x0C08, size: 0x8, params: {index: 1}}
  - {name: CPUTIMER2, model: ti_c2000.cputimer, base: 0x0C10, size: 0x8, params: {index: 2}}
  - {name: PIE, model: ti_c2000.pie, base: 0x0CE0, size: 0x120}
  # Peripheral Frame 1
  - {name: COMP1, model: ti_c2000.comp, base: 0x6400, size: 0x20, params: {index: 1, ramp: false}}   # no ramp generator in SPRS523 Table 9-23
  - {name: COMP2, model: ti_c2000.comp, base: 0x6420, size: 0x20, params: {index: 2, ramp: false}}
  - {name: EPWM1, model: ti_c2000.epwm_dc, base: 0x6800, size: 0x40, params: {gate: EPWM1ENCLK, index: 1, hrpwm: true, mep_step_ps: 150, sync_next: [EPWM2]}}
  - {name: EPWM2, model: ti_c2000.epwm_dc, base: 0x6840, size: 0x40, params: {gate: EPWM2ENCLK, index: 2, hrpwm: true, mep_step_ps: 150, sync_next: [EPWM3]}}
  - {name: EPWM3, model: ti_c2000.epwm_dc, base: 0x6880, size: 0x40, params: {gate: EPWM3ENCLK, index: 3, hrpwm: true, mep_step_ps: 150, sync_next: [EPWM4]}}
  - {name: EPWM4, model: ti_c2000.epwm_dc, base: 0x68C0, size: 0x40, params: {gate: EPWM4ENCLK, index: 4, hrpwm: true, mep_step_ps: 150, sync_next: []}}
  - {name: ECAP1, model: ti_c2000.ecap, base: 0x6A00, size: 0x20, params: {gate: ECAP1ENCLK, index: 1}}
  - {name: GPIO, model: ti_c2000.piccolo_gpio, base: 0x6F80, size: 0x80}
  # Peripheral Frame 2
  - {name: SYSCTRL, model: ti_c2000.piccolo_sysctrl, base: 0x7010, size: 0x20, params: {intosc1_hz: 10000000, intosc2_hz: 10000000, xtal_hz: 0, max_div: 12}}   # LaunchPad: no crystal
  - {name: SPIA, model: ti_c2000.spi, base: 0x7040, size: 0x10, params: {gate: SPIAENCLK, fifo_depth: 4}}
  - {name: SCIA, model: ti_c2000.sci, base: 0x7050, size: 0x10, params: {fifo_depth: 4}}
  - {name: NMIINT, model: ti_c2000.nmiwd, base: 0x7060, size: 0x10}
  - {name: XINT, model: ti_c2000.xint, base: 0x7070, size: 0x10}   # XINT1-3
  - {name: ADC, model: ti_c2000.adc_soc, base: 0x7100, size: 0x80, params: {triggers: 12, vrefhi_pin: ADCINA0}}
  - {name: I2CA, model: ti_c2000.i2c, base: 0x7900, size: 0x40, params: {gate: I2CAENCLK, fifo_depth: 4}}

# Interrupts by vector number (INTx.y = 32 + 8(x-1) + (y-1); 13/14 CPU INT13/INT14), SPRS523 Table 9-18.  ADCINT1/2 sit in
# group 1 and group 10; the group-10 copies are named ADCINT1_10 / ADCINT2_10 (the ADC pulses both).
irqs:
  13: INT13
  14: INT14
  18: NMI
  19: ILLEGAL
  32: ADCINT1        # 1.1
  33: ADCINT2        # 1.2
  35: XINT1          # 1.4
  36: XINT2          # 1.5
  37: ADCINT9        # 1.6
  38: TINT0          # 1.7
  39: WAKEINT        # 1.8
  40: EPWM1_TZINT    # 2.1
  41: EPWM2_TZINT    # 2.2
  42: EPWM3_TZINT    # 2.3
  43: EPWM4_TZINT    # 2.4
  48: EPWM1_INT      # 3.1
  49: EPWM2_INT      # 3.2
  50: EPWM3_INT      # 3.3
  51: EPWM4_INT      # 3.4
  56: ECAP1_INT      # 4.1
  72: SPIRXINTA      # 6.1
  73: SPITXINTA      # 6.2
  88: I2CINT1A       # 8.1
  89: I2CINT2A       # 8.2
  96: SCIRXINTA      # 9.1
  97: SCITXINTA      # 9.2
  104: ADCINT1_10     # 10.1
  105: ADCINT2_10     # 10.2
  106: ADCINT3        # 10.3
  107: ADCINT4        # 10.4
  108: ADCINT5        # 10.5
  109: ADCINT6        # 10.6
  110: ADCINT7        # 10.7
  111: ADCINT8        # 10.8
  120: XINT3          # 12.1

pins:
  - {num: 1, name: "GPIO29/SCITXDA/SCLA/TZ3", kind: gpio, port: A, bit: 29, default: GPIO, functions: {GPIO: "GPIO29", MUX1: "SCITXDA", MUX2: "SCLA", MUX3: "TZ3"}}
  - {num: 2, name: "TRST", kind: special}
  - {num: 3, name: "XRS", kind: special}
  - {num: 4, name: "ADCINA6/AIO6", kind: analog, functions: {ANALOG: "ADCINA6", AIO: "AIO6"}}
  - {num: 5, name: "ADCINA4/COMP2A/AIO4", kind: analog, functions: {ANALOG: "ADCINA4/COMP2A", AIO: "AIO4"}}
  - {num: 6, name: "ADCINA7", kind: analog, functions: {ANALOG: "ADCINA7"}}
  - {num: 7, name: "ADCINA3", kind: analog, functions: {ANALOG: "ADCINA3"}}
  - {num: 8, name: "ADCINA1", kind: analog, functions: {ANALOG: "ADCINA1"}}
  - {num: 9, name: "ADCINA2/COMP1A/AIO2", kind: analog, functions: {ANALOG: "ADCINA2/COMP1A", AIO: "AIO2"}}
  - {num: 10, name: "ADCINA0/VREFHI", kind: analog, functions: {ANALOG: "ADCINA0/VREFHI"}}
  - {num: 11, name: "VDDA", kind: power}
  - {num: 12, name: "VSSA/VREFLO", kind: special}
  - {num: 13, name: "ADCINB1", kind: analog, functions: {ANALOG: "ADCINB1"}}
  - {num: 14, name: "ADCINB2/COMP1B/AIO10", kind: analog, functions: {ANALOG: "ADCINB2/COMP1B", AIO: "AIO10"}}
  - {num: 15, name: "ADCINB3", kind: analog, functions: {ANALOG: "ADCINB3"}}
  - {num: 16, name: "ADCINB4/COMP2B/AIO12", kind: analog, functions: {ANALOG: "ADCINB4/COMP2B", AIO: "AIO12"}}
  - {num: 17, name: "ADCINB6/AIO14", kind: analog, functions: {ANALOG: "ADCINB6", AIO: "AIO14"}}
  - {num: 18, name: "ADCINB7", kind: analog, functions: {ANALOG: "ADCINB7"}}
  - {num: 19, name: "GPIO34/COMP2OUT", kind: gpio, port: B, bit: 2, default: GPIO, functions: {GPIO: "GPIO34", MUX1: "COMP2OUT"}}
  - {num: 20, name: "GPIO35/TDI", kind: gpio, port: B, bit: 3, default: GPIO, functions: {GPIO: "GPIO35"}}
  - {num: 21, name: "GPIO36/TMS", kind: gpio, port: B, bit: 4, default: GPIO, functions: {GPIO: "GPIO36"}}
  - {num: 22, name: "GPIO37/TDO", kind: gpio, port: B, bit: 5, default: GPIO, functions: {GPIO: "GPIO37"}}
  - {num: 23, name: "GPIO38/XCLKIN/TCK", kind: gpio, port: B, bit: 6, default: GPIO, functions: {GPIO: "GPIO38"}}
  - {num: 24, name: "GPIO18/SPICLKA/SCITXDA/XCLKOUT", kind: gpio, port: A, bit: 18, default: GPIO, functions: {GPIO: "GPIO18", MUX1: "SPICLKA", MUX2: "SCITXDA", MUX3: "XCLKOUT"}}
  - {num: 25, name: "GPIO19/XCLKIN/SPISTEA/SCIRXDA/ECAP1", kind: gpio, port: A, bit: 19, default: GPIO, functions: {GPIO: "GPIO19", MUX1: "SPISTEA", MUX2: "SCIRXDA", MUX3: "ECAP1"}}
  - {num: 26, name: "GPIO17/SPISOMIA/TZ3", kind: gpio, port: A, bit: 17, default: GPIO, functions: {GPIO: "GPIO17", MUX1: "SPISOMIA", MUX3: "TZ3"}}
