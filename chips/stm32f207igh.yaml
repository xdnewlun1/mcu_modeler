# STMicroelectronics STM32F207IGH: STM32F207 (Ethernet MAC + camera interface DCMI); Cortex-M3, 120 MHz, 1024 KB flash, 128 KB SRAM + 4 KB backup
# SRAM, UFBGA176+25. STM32F2 die DEV_ID 0x411 (RM0033 32.6.1).
# Same die, memory map, peripherals and IRQs as chips/stm32f207zg.yaml (included below); this file overrides
# name, package and pins.
# Sources: DS15818 Rev 15 (STM32F205xx/STM32F207xx data sheet, docs/datasheets/st/DS_stm32f207zg.pdf): Table 2/3
# (peripheral and GPIO counts), Table 8 (pin and ball definitions, UFBGA176 column), Table 10 (alternate function
# mapping AF0..AF15), section 7 (ordering information: R = 64, V = 100, Z = 144, I = 176 pins; G = 1024 KB flash;
# T = LQFP, H = UFBGA, Y = WLCSP). DS17050 Rev 9 (STM32F215xx/STM32F217xx, docs/datasheets/st/DS_stm32f217zg.pdf)
# Table 7 / Table 9 give the same pins and alternate functions (0 differences in Table 9 vs DS15818 Table 10).
# Generated with pdftotext -bbox from Tables 8 and 10 and cross-checked against ST's STM32_open_pin_data @ 7d1f1514
# (mcu/STM32F207I(C-E-F-G)Hx.xml, IP/GPIO-STM32F217_gpio_v1_0_Modes.xml; svd/dl-open-pin-data-f2/): 0 differences in pin/ball positions
# and names, 0 differences in AF numbers apart from the spellings listed below; additional functions (ADC channels,
# DAC, WKUP, RTC_AF1/2, OSC, VBUS) equal the XML. Data sheet corrections (asserted in tests/test_stm32f2_chip.py):
# PG13 AF8 USART6_CTS (Table 10 "UART6_CTS"); PA6 AF13 DCMI_PIXCLK (Table 10 "DCMI_PIXCK"; Table 8 and the XML say
# PIXCLK); PC3 AF5 also I2S2_SD (missing from Table 10, present in Table 8 and the XML); PB4 AF0 NJTRST (Table 10
# "JTRST"). Kept as DS15818 spells them (they differ from the F405 files and ST's XML): I2Sx_SCK (F4: I2Sx_CK; the
# SPI blocks get `params.i2s_ck: SCK`), PB15 AF0 RTC_50Hz (F4/XML: RTC_REFIN), PC13 RTC_AF1, PI8 RTC_AF2,
# PC9 AF5 I2S2_CKIN / AF6 I2S3_CKIN (XML: I2S_CKIN on AF5 only), PB13 OTG_HS_VBUS as an additional function only.
# There is no I2S2ext_SD / I2S3ext_SD (the F2 has no full-duplex I2S extension blocks).
# Ball numbering: `num` = row-major index over the 201 balls (rows A..R without I/O), `ball` = the ball name.
# The 25 centre balls F6..K10 are VSS (thermal balls, "UFBGA176+25"; from ST's XML, Table 8 lists the 176
# signal balls). Check with: tools/pin_table_check.py chips/stm32f207igh.yaml --expect 201
# Registers: chips/stm32f2xx_regs.yaml (STM32F21x.svd, see chips/README.md).
include: stm32f207zg.yaml
name: STM32F207IGH
package: UFBGA176+25
regs_file: stm32f2xx_regs.yaml

