# TI TMS320F280200 (Piccolo A, F2802x), 48-pin LQFP "PT": the TMS320F28027 die description (chips/tms320f28027.yaml: core,
# peripherals, IRQs, pins, boot ROM stand-in) with this part's memory and options, SPRS523P Table 6-1 (40 MHz,
# 8K-word flash, 3K-word SARAM, HRPWM none, eCAP1 none), Figure 9-5, Table 9-5, Table 9-11 (PARTID).
# The maximum SYSCLKOUT (40 MHz) is not enforced (the clock follows the PLL settings).
include: tms320f28027.yaml
name: TMS320F280200
memory:
  - {name: M0, base: 0x000000, size: 0x0400, kind: ram}
  - {name: M1, base: 0x000400, size: 0x0400, kind: ram}
  - {name: L0, base: 0x008000, size: 0x0400, kind: ram}        # L0 SARAM 1K, dual-mapped at 0x3F8000
  - {name: OTP, base: 0x3D7800, size: 0x07C0, kind: rom, fill: 0xFF}
  - {name: FLASH, base: 0x3F6000, size: 0x2000, kind: flash, fill: 0xFF}
  - {name: BOOTROM, base: 0x3FE000, size: 0x2000, kind: rom, fill: 0xFF}
drop: [L0HI, ECAP1, ECAP1_INT]
add_peripherals:
  - {name: L0HI, model: ti_c2000.alias, base: 0x3F8000, size: 0x400, params: {target: 0x8000}}
peripheral_params:
  PARTID: {value: 0x00C1}                  # SPRS523 Table 9-11 (TMS320F280200PT)
  DEV_EMU: {reset: {CLASSID: 0x00C7}}
  CSM: {secure_ranges: [[0x8000, 0x8400], [0x3D7800, 0x3D7C00], [0x3F6000, 0x3F8000], [0x3F8000, 0x3F8400]]}
  EPWM1: {hrpwm: false}
  EPWM2: {hrpwm: false}
  EPWM3: {hrpwm: false}
  EPWM4: {hrpwm: false}
