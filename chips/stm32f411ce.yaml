# STMicroelectronics STM32F411CE (STM32F411xC/E, Cortex-M4F, 100 MHz, 512 KB flash, 128 KB SRAM, UFQFPN48; the
# WeAct "Black Pill" V2/V3 part). Same die, memory, peripherals and IRQs as chips/stm32f411re.yaml (included); this
# file overrides name, package and pins. Part number: C = 48 pins, E = 512 KB, U = UFQFPN. Checked against RM0383 Rev 4;
# pins not checked against DS10314 (not in the repository).
include: stm32f411re.yaml
name: STM32F411CE
package: UFQFPN48
regs_file: stm32f411_regs.yaml

# All 48 package pins (36 GPIOs) from ST's STM32_open_pin_data @ 7d1f1514 mcu/STM32F411C(C-E)Ux.xml and
# IP/GPIO-STM32F411_gpio_v1_0_Modes.xml, normalised as in chips/stm32f411re.yaml.
pins:
  - {num: 1, name: VBAT, kind: power, default: VBAT}
  - {num: 2, name: PC13, kind: gpio, port: C, bit: 13, default: GPIO, functions: {AF15: EVENTOUT, additional: RTC_AF1}}
  - {num: 3, name: PC14/OSC32_IN, kind: gpio, port: C, bit: 14, default: GPIO, functions: {AF15: EVENTOUT, analog: OSC32_IN}}
  - {num: 4, name: PC15/OSC32_OUT, kind: gpio, port: C, bit: 15, default: GPIO, functions: {AF15: EVENTOUT, analog: OSC32_OUT}}
  - {num: 5, name: PH0/OSC_IN, kind: gpio, port: H, bit: 0, default: GPIO, functions: {AF15: EVENTOUT, analog: OSC_IN}}
  - {num: 6, name: PH1/OSC_OUT, kind: gpio, port: H, bit: 1, default: GPIO, functions: {AF15: EVENTOUT, analog: OSC_OUT}}
  - {num: 7, name: NRST, kind: special, default: NRST}
  - {num: 8, name: VSSA, kind: power, default: VSSA}
  - {num: 9, name: VDDA, kind: power, default: VDDA}
  - {num: 10, name: PA0/WKUP, kind: gpio, port: A, bit: 0, default: GPIO, functions: {AF1: TIM2_CH1/TIM2_ETR, AF2: TIM5_CH1, AF7: USART2_CTS, AF15: EVENTOUT, ADC: ADC1_IN0, additional: WKUP}}
  - {num: 11, name: PA1, kind: gpio, port: A, bit: 1, default: GPIO, functions: {AF1: TIM2_CH2, AF2: TIM5_CH2, AF5: SPI4_MOSI/I2S4_SD, AF7: USART2_RTS, AF15: EVENTOUT, ADC: ADC1_IN1}}
