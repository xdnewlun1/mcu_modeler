  - {name: FTM2, model: kinetis.ftm, base: 0x400B8000, size: 0x1000}
  - {name: FTM3, model: kinetis.ftm, base: 0x400B9000, size: 0x1000}
  - {name: ADC1, model: kinetis.adc, base: 0x400BB000, size: 0x1000, params: {index: 1}}
  - {name: DAC0, model: stub, base: 0x400CC000, size: 0x1000}
  - {name: I2C2, model: stub, base: 0x400E6000, size: 0x1000}
  - {name: UART4, model: kinetis.uart, base: 0x400EA000, size: 0x1000, params: {index: 4}}
  - {name: GPIOA, model: kinetis.gpio, base: 0x400FF000, size: 0x40, params: {port: A}}
  - {name: GPIOB, model: kinetis.gpio, base: 0x400FF040, size: 0x40, params: {port: B}}
  - {name: GPIOC, model: kinetis.gpio, base: 0x400FF080, size: 0x40, params: {port: C}}
