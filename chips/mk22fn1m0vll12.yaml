# External interrupt numbers (exception = 16 + n), MK22F12 header ordering.
# SVD (MK22F12, which also covers larger K22 packages) peripherals that the 100-pin part does not have.
# tools/svd2chip.py --check reports these as OMITTED instead of comparing them.
omitted:
  - {name: UART5, irqs: [68, 69], reason: "not on the 100-pin K22: 0x400EB000 unassigned (K22P100M120SF5V2RM Table 4-3, 4.5.3), IRQ 68/69 reserved (Table 3-5), no UART5 pins in data sheet 5.1"}
  - {name: DAC1, irqs: [72], reason: "not on the 100-pin K22: IRQ 72 reserved (K22P100M120SF5V2RM Table 3-5), DMAMUX source 46 reserved (Table 3-25), no DAC1 pin in data sheet 5.1"}

