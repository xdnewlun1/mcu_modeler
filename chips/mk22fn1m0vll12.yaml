# NXP/Freescale Kinetis MK22FN1M0VLL12 (K22F, 120 MHz, 100-pin LQFP).
# Sources: K22P100M120SF5 data sheet Rev4 11/2014 (section 5.1 signal multiplexing, transcribed row by row),
# K22P100M120SF5RM memory map / AIPS slot assignments, MK22F12 device header IRQ numbering.
name: MK22FN1M0VLL12
package: LQFP100
family: kinetis
regs_file: mk22_regs.yaml
core: {arch: armv7e-m, backend: unicorn, cpu: cortex-m4, fpu: true, clock_hz: 120000000, addr_unit_bits: 8, num_irqs: 96}
# SysTick has no external reference on the K22 (K22P100M120SF5V2RM section 3.2.1.2): CLKSOURCE always reads 1,
# SYST_CALIB NOREF=1, TENMS=0.  0 = no reference (armv7m.scs).
systick_ext_div: 0

memory:
  - {name: FLASH, base: 0x00000000, size: 0x100000, kind: flash}
  - {name: SRAM_L, base: 0x1FFF0000, size: 0x10000, kind: ram}
  - {name: SRAM_U, base: 0x20000000, size: 0x10000, kind: ram}

# armv7m.scs (0xE000E000, SysTick/NVIC/SCB) is created by the arch layer, not listed here.
peripherals:
  - {name: AIPS0, model: stub, base: 0x40000000, size: 0x1000}
  - {name: AXBS, model: stub, base: 0x40004000, size: 0x1000}
  - {name: DMA, model: kinetis.dma, base: 0x40008000, size: 0x2000}
  - {name: FB, model: stub, base: 0x4000C000, size: 0x1000}
  - {name: MPU, model: stub, base: 0x4000D000, size: 0x1000}
  - {name: FMC, model: stub, base: 0x4001F000, size: 0x1000}
  - {name: FTFE, model: kinetis.ftfe, base: 0x40020000, size: 0x1000}
  - {name: DMAMUX, model: kinetis.dmamux, base: 0x40021000, size: 0x1000}
  - {name: CAN0, model: stub, base: 0x40024000, size: 0x1000}
  - {name: SPI0, model: kinetis.dspi, base: 0x4002C000, size: 0x1000, params: {index: 0}}
  - {name: SPI1, model: kinetis.dspi, base: 0x4002D000, size: 0x1000, params: {index: 1}}
  - {name: I2S0, model: stub, base: 0x4002F000, size: 0x1000}
  - {name: CRC, model: stub, base: 0x40032000, size: 0x1000}
  - {name: USBDCD, model: stub, base: 0x40035000, size: 0x1000}
