# TMS320F28232 (C2823x) register table, HAND-WRITTEN: TI publishes no SVD for the C2000 F2833x/F2823x family.
# Same schema as tools/svd2chip.py output (chips/README.md) so chipem.regtable.regs_for() reads it unchanged.
# Generated once from a transcription script (register names/offsets/reset values) of:
#   SPRS439Q TMS320F2833x/F2823x data sheet (section 8: memory map, peripheral frames, Table 8-17 GPIO,
#   8-27..8-35), SPRUFB0 TMS320x2833x/2823x System Control and Interrupts reference guide (PLL, clocks, watchdog,
#   CPU timers, PIE, GPIO, XINT), SPRUFZ5 SCI guide, SPRU812 ADC guide, SPRUG04 ePWM, SPRUFG4A eCAP, SPRUG79 I2C.
# Address units are 16-bit words: offsets/sizes/widths count words; a width-2 register is 32 bits with its low
# word at the lower address. Peripherals not on the F28232 (SCI-C, McBSP-B, eCAP5/6) are omitted.
device: TMS320F28232
svd_version: "hand-written"
address_unit_bits: 16
cpu: {name: C28x, fpu: false}
interrupts:                 # PIE vector numbers (INTx.y = 32 + 8(x-1) + (y-1)); 13/14 INT13/INT14, 18 NMI
  13: INT13
  14: INT14
  18: NMI
  19: ILLEGAL
  32: SEQ1INT
