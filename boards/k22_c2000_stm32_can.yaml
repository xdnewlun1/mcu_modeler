# Three CAN controllers of three families on one bus at 500 kbit/s: MK22FN1M0VLL12 FlexCAN0, TMS320F28232 eCAN-A and
# STM32F405ZG bxCAN1.
#   A (K22, firmware/samples/can_echo.c) sends 100#<counter>4B32 every 10 ms and prints what it receives (0x200-0x27F).
#   B (F28232, firmware/samples_c2000_c/can_echo.c, TI cl2000) echoes 0x100 as 0x201.
#   C (STM32, firmware/samples_stm32/can_echo.c) echoes 0x100 as 0x202.
# Both echoes become ready while the K22 frame ends; 0x201 wins the arbitration, 0x202 follows after the intermission
# (or later, depending on each firmware's reaction time).  The F28232 joins the bus only after its PLL relock (~6.6 ms).
# Run:  chipem run --board boards/k22_c2000_stm32_can.yaml --for 50ms
name: k22_c2000_stm32_can
quantum: 10us
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/can_echo.elf, clock_hz: 120000000}
  - {id: B, chip: tms320f28232, firmware: ../firmware/samples_c2000_c/build/can_echo.out}
  - {id: C, chip: stm32f405zg, firmware: ../firmware/samples_stm32/build/can_echo.elf}
links:
  - {type: can, name: CANBUS, nodes: [A.CAN0, B.ECANA, C.CAN1]}
