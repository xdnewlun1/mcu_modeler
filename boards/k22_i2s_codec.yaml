# A Kinetis K22 I2S0 (SAI) master and an I2S codec part: the K22 plays a 1 kHz tone (8 kHz stereo, 16 bit, I2S
# format, 256 kHz bit clock from a 2.048 MHz MCLK) and records what the codec sends back.
#   A (MK22FN1M0VLL12) runs i2s_tone: TX on PTB18 BCLK / PTB19 FS (word select) / PTC1 TXD0, RX synchronous to TX on
#                      PTC5 RXD0; after 64 frames prints "I2S 8000 Hz: tx .. rx .. ok" and the first received words.
#   CODEC (i2s_codec part): records every frame from SDIN (`frames`), plays back the pattern on SDOUT.
# Run:   chipem run --board boards/k22_i2s_codec.yaml --for 12ms
#        chipem serve --board boards/k22_i2s_codec.yaml
# Build: firmware/samples/build.sh
name: k22_i2s_codec
quantum: 1us
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/i2s_tone.elf, clock_hz: 120000000}
nets:
  - {name: BCLK, pins: [A.PTB18]}
  - {name: WS, pins: [A.PTB19]}
  - {name: SDIN, pins: [A.PTC1]}
  - {name: SDOUT, pins: [A.PTC5], pull: down}
parts:
  - {id: CODEC, type: i2s_codec, bits: 16, format: i2s, pattern: "4660,-4660,22136,-22136",
     ports: {bclk: BCLK, ws: WS, sdin: SDIN, sdout: SDOUT}}
