# MK22FN1M0VLL12 USB0 (dedicated USB0_DP / USB0_DM pins, VBUS on VREGIN) plugged into an emulated PC (chipem/usbbus.py).
# The bare-metal CDC-ACM firmware switches the MCG to PEE (8 MHz crystal, PLL 120 MHz) and feeds the USB module
# MCGPLLCLK x 2/5 = 48 MHz.  The host waits the 100 ms attach debounce, resets the port, enumerates
# (1FC9:0094 "CHIP_EM" "K22 bare-metal CDC"), binds its CDC-ACM driver (SET_LINE_CODING, SET_CONTROL_LINE_STATE
# DTR|RTS) and polls bulk IN; the firmware answers DTR with "K22 CDC ready" and echoes what the host types
# ("hello" at 250 ms).  Run:
#   chipem run --board boards/k22_usb_cdc.yaml --for 300ms
name: k22_usb_cdc
chips:
  - {id: K, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/usb_cdc.elf}
links:
  - {type: usb, name: USB1, device: K.USB0, host: {debounce: 100ms, cdc_send: "hello\r\n", cdc_send_at: 250ms}}
