# A Kinetis K22 and an STM32F405 talking over UART (byte-level link): two vendors, two peripheral families, one board.
#   A (MK22FN1M0VLL12) runs uart_link_sender: sends "ping N\r\n" every 2 ms on UART0, toggles PTC5 on every reply line.
#   B (STM32F405ZG)    runs uart_link_echo:   echoes every byte uppercased on USART1 (PA9/PA10), toggles PB0 per byte.
# Run:  chipem run --board boards/k22_stm32_uart.yaml --for 20ms
# Paths are relative to this file. The K22 sample assumes a 120 MHz core (it does not program the MCG), so clock_hz
# pins it there (UART0 is core-clocked: 115,163 baud). The STM32 sample runs on the 16 MHz HSI reset clock
# (USART1 on APB2 = 16 MHz, BRR = 139: 115,108 baud); its RCC model derives the clock, so no clock_hz is given.
name: k22_stm32_uart
quantum: 10us
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/uart_link_sender.elf, clock_hz: 120000000}
  - {id: B, chip: stm32f405zg, firmware: ../firmware/samples_stm32/build/uart_link_echo.elf}
links:
  # bytes written to A's UART0_D arrive in B's USART1 receiver one character time later, and back
  - {type: uart, from: A.UART0, to: B.USART1}
