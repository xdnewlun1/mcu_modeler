# A TMS320F28232 (C2000) and an MK22FN1M0VLL12 (Kinetis) talking over a UART link.
#   A (K22) runs uart_link_sender: sends "ping N\r\n" every 2 ms on UART0, toggles PTC5 on every reply line.
#   B (F28232) runs uart_link_echo: echoes every SCI-A byte uppercased, toggles GPIO34 per byte.
# Run:  chipem run --board boards/c2000_k22_uart.yaml --for 20ms
# The K22 samples assume a 120 MHz core (clock_hz pins it); UART0 then runs at 115200 baud.  The F28232 programs its
# own PLL (20 MHz x 10 / 2 = 100 MHz) about 6.6 ms after reset (PLL lock time); bytes sent before its SCI-A is enabled are
# lost on the wire, as on hardware (uart events dir=drop), and the echo starts with the first line after that.  SCI-A: LSPCLK 25 MHz, BRR 26 -> 115741 baud (+0.5 %, within the link's 3 % tolerance).
name: c2000_k22_uart
quantum: 10us
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/uart_link_sender.elf, clock_hz: 120000000}
  - {id: B, chip: tms320f28232, firmware: ../firmware/samples_c2000/build/uart_link_echo.c28img}
links:
  - {type: uart, from: A.UART0, to: B.SCIA}
