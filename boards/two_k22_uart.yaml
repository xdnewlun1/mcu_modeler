# Two MK22FN1M0VLL12 chips talking over UART0 (byte-level link).
#   A runs uart_link_sender: sends "ping N\r\n" every 2 ms, toggles PTC5 on every reply line.
#   B runs uart_link_echo:   echoes every byte uppercased, toggles PTC5 per byte.
# Run:  chipem run --board boards/two_k22_uart.yaml --for 20ms
# Paths are relative to this file. The samples assume a 120 MHz core (they do not program the MCG), so clock_hz
# pins both cores there; UART0 is core-clocked, so both ends then run at 115200 baud.
name: two_k22_uart
quantum: 10us
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/uart_link_sender.elf, clock_hz: 120000000}
  - {id: B, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/uart_link_echo.elf, clock_hz: 120000000}
links:
  # byte-level link: bytes written to A's UART0_D arrive in B's UART0 receiver one character time later, and back
  - {type: uart, from: A.UART0, to: B.UART0}
nets:
  # an ordinary wire between the two PTC6 pins with a pull-up (neither sample uses it; drive it with --set/--at,
  # e.g. --at 5ms:B.PTC6=0, and both chips see the level)
  - {name: BTN, pins: [A.PTC6, B.PTC6], pull: up}
