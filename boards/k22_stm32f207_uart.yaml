# K22 (MK22FN1M0VLL12) <-> STM32F207ZG over UART: the K22 sends a counter line every few ms on UART0 (PTB16/PTB17);
# the STM32F207 (Cortex-M3, STM32F2 die) echoes it upper-cased on USART1 (PA9/PA10, HSI 16 MHz) with the unchanged
# STM32F405 uart_link_echo sample rebuilt for the Cortex-M3 (firmware/samples_stm32f2/build.sh).
name: k22_stm32f207_uart
quantum: 10us
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/uart_link_sender.elf, clock_hz: 120000000}
  - {id: B, chip: stm32f207zg, firmware: ../firmware/samples_stm32f2/build/uart_link_echo.elf}
links:
  - {type: uart, from: A.UART0, to: B.USART1}
