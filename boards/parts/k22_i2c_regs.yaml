# K22 I2C0 master + an I2C register device written in Python (boards/parts/i2c_regs.py, ~20 lines).
#   A (MK22FN1M0VLL12, 120 MHz) runs i2c_reg_master: I2C0 on PTB2 (SCL) / PTB3 (SDA), 93.75 kHz. It probes 0x43
#   (nobody: NACK), writes "Hello over I2C!" at register 0x10 of the device at 0x42, reads it back with a repeated
#   START and prints the result and PASS on UART0.
# Run:   chipem run --board boards/parts/k22_i2c_regs.yaml --for 30ms
# Build: firmware/samples/build.sh
# Security: a script part runs Python with your privileges. Only load boards you trust.
name: k22_i2c_regs
quantum: 1us
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../../firmware/samples/build/i2c_reg_master.elf, clock_hz: 120000000}
nets:
  - {name: SCL, pins: [A.PTB2], open_drain: true}
  - {name: SDA, pins: [A.PTB3], open_drain: true}
parts:
  - {id: DEV1, type: script, file: i2c_regs.py, params: {address: 0x42}, ports: {SDA: SDA, SCL: SCL}}
