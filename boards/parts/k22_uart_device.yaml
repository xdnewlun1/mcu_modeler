# A K22 talking to a serial device written in Python (boards/parts/uart_device.py) over UART0 wires.
#   A (MK22FN1M0VLL12, 120 MHz) runs uart_link_sender: UART0 on PTA2 (TX) / PTA1 (RX), 115200 8N1; every 2 ms it
#   sends "ping N\r\n"; every reply line toggles PTC5 (watch LED1).
#   DEV1 answers "pong N" (and id?, temp?, set temp X: type them from the web UI's UART input or the shell).
#   To develop PC software against the device instead, set `host: pty` in DEV1's params (or tcp:5555): the device
#   then talks to the PTY the run prints, not to the K22.
# Run:   chipem run --board boards/parts/k22_uart_device.yaml --for 7ms
# Build: firmware/samples/build.sh
# Security: a script part runs Python with your privileges. Only load boards you trust.
name: k22_uart_device
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../../firmware/samples/build/uart_link_sender.elf, clock_hz: 120000000}
nets:
  - {name: K22_TX, pins: [A.PTA2]}
  - {name: K22_RX, pins: [A.PTA1]}
parts:
  - {id: DEV1, type: script, file: uart_device.py, ports: {RX: K22_TX, TX: K22_RX}}
  - {id: LED1, type: led, ports: {in: A.PTC5}}
