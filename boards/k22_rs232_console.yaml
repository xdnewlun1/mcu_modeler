# K22 command console behind an RS-232 transceiver, an RJ50 jack, a DB9-to-RJ50 cable and a USB-serial adapter
# on the PC: the physical chain of a typical device service port, end to end.
#
#   K22 UART0 (PTA2 TX / PTA1 RX, 3.3 V) -- U1 rs232_transceiver (MAX3232-like, inverting, +/-6 V)
#     -- J1 RJ50 (10P10C) jack on the device -- W1 cable RJ50 plug <-> DB9 female
#     -- PC usb_serial_adapter (DB9 male DTE) -- host PTY: open the printed /dev/pts/N in your terminal program
#
#   .venv/bin/chipem run --board boards/k22_rs232_console.yaml          # runs until Ctrl-C, real time
#   picocom -b 115200 /dev/pts/N      (or screen /dev/pts/N 115200, minicom -D, PuTTY on the path, pyserial ...)
#
# The device's RJ50 pinout is this example's own (DB9-RJ50 cables are vendor specific; there is no standard):
#   J1: 2 GND, 3 TXD (out), 4 RXD (in), 5 DTR (in), 6 CTS (out), 7 GND; 1, 8-10 not connected.
# Swap two wires in W1's map, remove U1 or the GND wire and the console stops working, as it would on a bench.
name: k22_rs232_console
quantum: 10us
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/uart_console.elf, clock_hz: 120e6}
parts:
  - {id: GND, type: gnd, ports: {out: GND}}
  - id: U1
    type: rs232_transceiver
    drivers: 2
    receivers: 2
    ports: {t1in: A.PTA2, t1out: RS_TXD, r1in: RS_RXD, r1out: A.PTA1,
            t2in: A.PTC7, t2out: RS_CTS, r2in: RS_DTR, r2out: A.PTC6, gnd: GND}
  - id: LED1
    type: led
    ports: {in: A.PTC5}
  - id: J1
    type: rj50
    names: {2: GND, 3: TXD, 4: RXD, 5: DTR, 6: CTS, 7: GND}
    ports: {"2": GND, "3": RS_TXD, "4": RS_RXD, "5": RS_DTR, "6": RS_CTS, "7": GND}
  - id: PC
    type: usb_serial_adapter
    port: pty                 # pty:/tmp/ttyK22 adds a stable symlink; tcp:5555 for a raw TCP port; serial:COM7
    baud: 115200
  - id: W1
    type: cable
    a: rj50                   # RJ50 plug, into the device's J1
    b: db9f                   # DB9 female, onto the adapter's DB9 male
    plug_a: J1
    plug_b: PC
    map: {3: 2, 4: 3, 2: 5, 5: 4, 6: 8}   # TXD->RXD, RXD<-TXD, GND-GND, DTR, CTS (RJ50 pin: DB9 pin)
