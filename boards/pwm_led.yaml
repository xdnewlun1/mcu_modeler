# PWM outputs driving board parts: two timer PWM samples, each lighting an LED and watched by a logic probe.
#   A (STM32F405ZG)    runs tim_pwm: TIM3 CH1 PWM mode 1 on PA6, 1 kHz, 25 % (reset clock HSI 16 MHz).
#   B (MK22FN1M0VLL12) runs ftm_pwm: FTM0 CH0 edge-aligned PWM on PTC1, 1 kHz, 25 % (bus 60 MHz: clock_hz 60 MHz,
#                      SIM_CLKDIV1 reset value, bus = core).
# Parts: LED_A / P_A on net PWM_A (A.PA6), LED_B / P_B on net PWM_B (B.PTC1). The probes measure the frequency of
# the rising edges (state.freq_hz, 1000 Hz). `chipem run` prints one waveform summary per signal per 10 ms window
# instead of one line per edge (--all-edges prints them all); the VCD (--vcd) has every edge.
# Run:   chipem run --board boards/pwm_led.yaml --for 20ms
#        chipem serve --board boards/pwm_led.yaml
# Build: firmware/samples_stm32/build.sh; firmware/samples/build.sh
name: pwm_led
quantum: 10us
chips:
  - {id: A, chip: stm32f405zg, firmware: ../firmware/samples_stm32/build/tim_pwm.elf}
  - {id: B, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/ftm_pwm.elf, clock_hz: 60000000}
nets:
  - {name: PWM_A, pins: [A.PA6]}
  - {name: PWM_B, pins: [B.PTC1]}
parts:
  - {id: LED_A, type: led, color: green, ports: {in: PWM_A}}
  - {id: P_A, type: probe, ports: {in: PWM_A}}
  - {id: LED_B, type: led, color: yellow, ports: {in: PWM_B}}
  - {id: P_B, type: probe, ports: {in: PWM_B}}
