# The same quadrature_encoder part on a K22: FTM1's quadrature decoder (phase A/B mode) counts it.
#   ENC: 100 lines at 600 rpm = 4000 edges per second, clockwise (A leads B), no index; a -> PTB0 (FTM1_QD_PHA),
#        b -> PTB1 (FTM1_QD_PHB).  The stimulus reverses it at 30 ms.
#   A (MK22FN1M0VLL12, 60 MHz) runs ftm_qd: every 10 ms it prints "qd <CNT> up|down" on UART0 (+40 per line while
#        turning clockwise, -40 after the reversal).
# Run:   chipem run --board boards/k22_ftm_qd_encoder.yaml --for 60ms
# Build: firmware/samples/build.sh
name: k22_ftm_qd_encoder
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/ftm_qd.elf, clock_hz: 60000000}
parts:
  - {id: ENC, type: quadrature_encoder, ppr: 100, rpm: 600, direction: cw, index: false,
     ports: {a: A.PTB0, b: A.PTB1}}
stimulus: ["30ms:ENC=ccw"]
