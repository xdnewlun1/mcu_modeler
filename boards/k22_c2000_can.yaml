# An MK22FN1M0VLL12 (Kinetis FlexCAN0) and a TMS320F28232 (eCAN-A) on one CAN bus at 500 kbit/s.
#   A (K22) runs firmware/samples/can_echo.c: every 10 ms a frame 100#<counter>4B32 from message buffer 8; prints
#     every received frame (IDs 0x200-0x27F) on UART0.
#   B (F28232) runs firmware/samples_c2000_c/can_echo.c (TI cl2000): mailbox 16 receives ID 0x100 and echoes the data
#     as ID 0x201 from mailbox 0; prints both on SCI-A.
# Run:  chipem run --board boards/k22_c2000_can.yaml --for 100ms
# The F28232 joins the bus only after its PLL relock (~6.6 ms) and init; the K22's first frame (10 ms) is then
# acknowledged.  Each 4-byte standard frame takes 76 bits + stuff bits at 2 us/bit (~0.16 ms); the echo follows after
# the C2000 firmware has read the mailbox and set CANTRS.  Wiring: PTB18/PTB19 (CAN0_TX/RX, ALT2) and GPIO31/GPIO30
# (CANTXA/CANRXA, mux 1) to the transceivers; the link joins the controllers (frames are not carried by pin nets).
name: k22_c2000_can
quantum: 10us
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/can_echo.elf, clock_hz: 120000000}
  - {id: B, chip: tms320f28232, firmware: ../firmware/samples_c2000_c/build/can_echo.out}
links:
  - {type: can, name: CANBUS, nodes: [A.CAN0, B.ECANA]}
