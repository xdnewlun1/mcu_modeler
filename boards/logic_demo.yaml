# Board parts demo: switches, LEDs, a clock, gates, a flip-flop, probes and a counter around two K22s.
#   A (MK22FN1M0VLL12) runs button_mirror: PTC6 input with pull-up, PTC5 = !PTC6.
#   B (MK22FN1M0VLL12) runs port_irq:      PTC6 falling edge -> PORTC IRQ -> toggles PTC5.
# Parts:
#   SW1  switch on A.PTC6. LED1 (active low) on A.PTC5 (net LED_A): it lights while SW1 is H (PTC5 = !PTC6 = L).
#   CLK1 1 kHz clock (net CLK) -> INV1 (not) -> B.PTC6: every clock rise is a falling edge on B.PTC6, so B's IRQ
#        handler toggles B.PTC5 at 500 Hz; P2 (probe) and CNT1 (counter) watch B.PTC5.
#   G1   AND of LED_A and CLK -> net GATED -> P1 (probe): 1 kHz while SW1 is L (LED_A high), quiet while SW1 is H.
#   FF1  D flip-flop sampling LED_A on every clock rise -> net LATCHED -> LED2.
# Stimulus: SW1 goes H at 2 ms (LED1 on, GATED stops) and back to L at 4 ms.
# Run:   chipem run --board boards/logic_demo.yaml --for 8ms
#        chipem serve --board boards/logic_demo.yaml
name: logic_demo
quantum: 10us
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/button_mirror.elf, clock_hz: 120000000}
  - {id: B, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/port_irq.elf, clock_hz: 120000000}
nets:
  - {name: LED_A, pins: [A.PTC5]}
  - {name: B_LED, pins: [B.PTC5]}
parts:
  - {id: SW1, type: switch, level: L, ports: {out: A.PTC6}}
  - {id: LED1, type: led, active: L, color: green, ports: {in: LED_A}}
  - {id: CLK1, type: pulse, period: 1ms, ports: {out: CLK}}
  - {id: INV1, type: not, ports: {in: CLK, out: B.PTC6}}
  - {id: G1, type: and, inputs: 2, ports: {in0: LED_A, in1: CLK, out: GATED}}
  - {id: P1, type: probe, ports: {in: GATED}}
  - {id: FF1, type: dff, ports: {d: LED_A, clk: CLK, q: LATCHED}}
  - {id: LED2, type: led, color: yellow, ports: {in: LATCHED}}
  - {id: P2, type: probe, ports: {in: B_LED}}
  - {id: CNT1, type: counter, ports: {in: B_LED}}
stimulus: ["2ms:SW1=H", "4ms:SW1=L"]
