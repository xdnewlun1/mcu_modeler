# Same two chips as boards/two_k22_uart.yaml, wired with nets only (TX of one chip to RX of the other), NO `links:`.
#
# Peripheral pin functions do not toggle pin levels in this emulator (the UART models work on bytes), but the board
# watches every net: once the firmware muxes A.PTA2 to UART0_TX and B.PTA1 to UART0_RX, the net A_TX_B_RX carries
# A's UART0 bytes to B's UART0 (an automatic one-way byte link, logged as
# "net A_TX_B_RX: auto UART link A.UART0 → B.UART0"), and B_TX_A_RX carries the replies back. If the firmware
# re-muxes a pin, the auto link is removed or re-created. Nets also carry GPIO levels (outputs on one chip drive
# inputs on the other).
# Run:  chipem run --board boards/two_k22_uart_pins.yaml --for 20ms
name: two_k22_uart_pins
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/uart_link_sender.elf, clock_hz: 120000000}
  - {id: B, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/uart_link_echo.elf, clock_hz: 120000000}
nets:
  - {name: A_TX_B_RX, pins: [A.PTA2, B.PTA1]}         # A.UART0_TX -> B.UART0_RX (auto UART link)
  - {name: B_TX_A_RX, pins: [B.PTA2, A.PTA1]}         # B.UART0_TX -> A.UART0_RX (auto UART link)
  - {name: LED_A_TO_B, pins: [A.PTC5, B.PTC7]}       # A's LED output (GPIO) is visible as an input level on B.PTC7
  - {name: BTN, pins: [A.PTC6, B.PTC6], pull: up}
stimulus: ["5ms:A.PTC6=0", "6ms:A.PTC6=Z"]
