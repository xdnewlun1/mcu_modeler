# A LAUNCHXL-F28027 (TMS320F28027, Piccolo A) and an MK22FN1M0VLL12 (Kinetis) on a UART link.
#   A (K22) runs uart_link_sender: sends "ping N\r\n" every 2 ms on UART0, toggles PTC5 on every reply line.
#   B (F28027) runs f28027_sci_echo: echoes every SCI-A byte uppercased and toggles the LaunchPad LED GPIO0 per
#     byte.  SCI-A on the LaunchPad backchannel pins GPIO28 (SCIRXDA) / GPIO29 (SCITXDA), GPAMUX2 = 1.
# Run:  chipem run --board boards/f28027_k22_uart.yaml --for 20ms
# The F28027 boots on INTOSC1 (10 MHz), locks its PLL to 60 MHz after 6.55 ms (PLLLOCKPRD reset value) and enables
# SCI-A then: earlier bytes are dropped on the wire as on hardware (uart events dir=drop).  SCI-A: LSPCLK = 60 MHz
# (LOSPCP = 0), BRR 64 -> 115385 baud (+0.16 %).
name: f28027_k22_uart
quantum: 10us
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/uart_link_sender.elf, clock_hz: 120000000}
  - {id: B, chip: tms320f28027, firmware: ../firmware/samples_c2000/build/f28027_sci_echo.c28img}
links:
  - {type: uart, from: A.UART0, to: B.SCIA}
