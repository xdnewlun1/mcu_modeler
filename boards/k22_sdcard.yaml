# Kinetis MK22FN1M0VLL12 SDHC host (port E ALT4: PTE0 D1, PTE1 D0, PTE2 DCLK, PTE3 CMD, PTE4 D3, PTE5 D2) + a 64 MB
# SDHC card. The firmware (120 MHz core, as the samples assume) identifies the card at 375 kHz, switches to a 4-bit
# bus at 20 MHz, writes/reads block 2 through DATPORT, writes blocks 4-5 with simple DMA (CMD25 + auto CMD12) and
# reads them back with ADMA2 (CMD18 + auto CMD12); UART0 (PTA2) prints the steps and "done".
# Give the card an image with `image: card.img` (and `save: out.img` or `writeback: 1` to keep what it wrote).
name: k22_sdcard
chips:
  - {id: A, chip: mk22fn1m0vll12, firmware: ../firmware/samples/build/sdhc_card.elf, clock_hz: 120000000}
devices:
  - {type: sd_card, chip: A, host: SDHC, size: 64M, kind: sdhc}
